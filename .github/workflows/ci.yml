name: Focused baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples/http-agent
      - run: ruff format --check src tests examples/http-agent
      - run: python -m pytest
      - run: python -m build
      - run: agentbreeder validate examples/http-agent/agent.yaml
      - run: AGENTBREEDER_DOCKER_TEST=1 python -m pytest tests/test_local_integration.py -q
