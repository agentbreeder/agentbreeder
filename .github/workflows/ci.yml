name: Focused baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python scripts/content_manifest.py --check
      - run: python -m pytest
      - run: AGENTBREEDER_PACKAGING_TEST=1 python -m pytest tests/test_packaging.py -q
      - run: python -m build
      - run: agentbreeder validate src/agentbreeder/examples/http-agent/agent.yaml
      - run: AGENTBREEDER_DOCKER_TEST=1 python -m pytest tests/test_local_integration.py -q
  runtime-adk:
    # The ADK runtime's own tests (its MCP client against the real relay, #746) need the
    # runtime's locked dependencies, so they run apart from the repo suite (testpaths = tests).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r src/agentbreeder/builtin_registry/runtime/adk/1.1.0/runtime/requirements.lock
      - run: python -m pip install pytest==8.4.2
      - run: >-
          python -m pytest -q -p no:cacheprovider
          src/agentbreeder/builtin_registry/runtime/adk/1.1.0/runtime_tests
