name: Changelog fragments
# #893: a PR adds changelog.d/<issue>.<type>.md instead of editing CHANGELOG.md, which only a
# release PR (label `release`) edits. Labels can change without a push, so label events rerun it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  fragments:
    runs-on: ubuntu-latest
    steps:
      # The test-merge commit and its first parent (the base), so HEAD^1..HEAD is the PR's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check fragments and CHANGELOG.md
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python -I scripts/changelog.py check --labels-json "$PR_LABELS" --author "$PR_AUTHOR"
