# Supporting stack for the Northwind support agent. Start everything with ./up.sh, which runs
# this file and then deploys the agent itself through AgentBreeder's identity gate.
# Every port is published on 127.0.0.1 only. Secrets are files in .secrets/ (0600), mounted as
# Compose secrets; nothing secret is baked into these images.
name: agentbreeder-northwind

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # Secret files are bind-mounted with host ownership (0600), so run as the host user.
  user: "${HOST_UID:?run ./up.sh}:${HOST_GID:?run ./up.sh}"
  tmpfs: [/tmp]
  restart: unless-stopped

x-pgvector: &pgvector pgvector/pgvector@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f

services:
  postgres:
    image: *pgvector
    container_name: abnw-db
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]   # the AgentBreeder-deployed agent reaches it via host.docker.internal
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "support", "-d", "support"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  db-init:   # one-shot: create the phoenix, adk + litellm databases; apply commerce schema + seed data
    image: *pgvector
    depends_on: {postgres: {condition: service_healthy}}
    secrets: [db_password]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        export PGPASSWORD="$$(cat /run/secrets/db_password)";
        for db in phoenix adk litellm; do
        psql -h postgres -U support -d support -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1
        || psql -h postgres -U support -d support -c "CREATE DATABASE $$db" || exit 1; done
        && psql -q -v ON_ERROR_STOP=1 -h postgres -U support -d support -f /db/commerce.sql
    volumes: ["./db:/db:ro"]   # commerce schema + seed data (idempotent)
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    container_name: abnw-phoenix
    depends_on: {db-init: {condition: service_completed_successfully}}
    env_file: [.secrets/phoenix.env, .secrets/phoenix-db.env]   # auth secrets + DB password
    environment:
      PHOENIX_POSTGRES_HOST: postgres
      PHOENIX_POSTGRES_PORT: "5432"
      PHOENIX_POSTGRES_USER: support
      PHOENIX_POSTGRES_DB: phoenix
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_DISABLE_AGENT_ASSISTANT: "true"
      PHOENIX_AGENTS_DISABLE_BASH: "true"
      PHOENIX_AGENTS_DISABLE_WEB_ACCESS: "true"
      PHOENIX_AGENTS_DISABLE_GITHUB: "true"
      PHOENIX_ALLOWED_SANDBOX_PROVIDERS: NONE
    ports: ["127.0.0.1:6006:6006"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)"]
      interval: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  litellm:   # model gateway: Gemini direct, OpenRouter fallback; per-agent virtual keys + budgets
    image: ghcr.io/berriai/litellm-database@sha256:35f2cec3a14bb297e08bfab56c1fc377432bc4071aaf71978fdff043a5d91e79   # v1.106.2
    container_name: abnw-litellm
    depends_on: {db-init: {condition: service_completed_successfully}}
    entrypoint: ["/app/config/entrypoint.sh"]
    volumes: ["./litellm:/app/config:ro"]
    secrets: [db_password, gemini_api_key, openrouter_api_key, litellm_master_key]
    environment:
      LITELLM_LOG: WARNING
      LITELLM_TELEMETRY: "False"
      DISABLE_ADMIN_UI: "True"
      NO_DOCS: "True"
      STORE_MODEL_IN_DB: "False"
      HOME: /tmp
    <<: *hardened
    ports: ["127.0.0.1:4000:4000"]   # the agent reaches it via host.docker.internal:4000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  proxy:
    <<: *hardened
    build: {context: ., dockerfile: Dockerfile.host}
    image: agentbreeder-northwind-host:local
    command: ["python", "/app/proxy.py"]
    environment:
      PROXY_HOST: 0.0.0.0
      PHOENIX_URL: http://phoenix:6006
      TAVILY_API_KEY_FILE: /run/secrets/tavily_api_key
      PHOENIX_API_KEY_FILE: /run/secrets/phoenix_api_key
    secrets: [tavily_api_key, phoenix_api_key]
    ports: ["127.0.0.1:8787:8787"]   # the agent reaches it via host.docker.internal:8787
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 5s
      retries: 20

  ops:
    <<: *hardened
    build: {context: ., dockerfile: Dockerfile.host}
    image: agentbreeder-northwind-host:local
    working_dir: /app/ops
    command: ["python", "server.py"]
    depends_on:
      postgres: {condition: service_healthy}
      proxy: {condition: service_healthy}
      phoenix: {condition: service_healthy}
    environment:
      OPS_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD_FILE: /run/secrets/db_password
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key   # LLM judge (trusted host-side code)
      PHOENIX_URL: http://phoenix:6006
      PHOENIX_PUBLIC_URL: http://127.0.0.1:6006
      PHOENIX_API_KEY_FILE: /run/secrets/phoenix_api_key
      ONLINE_EVAL_SAMPLE_RATE: "1.0"
    secrets: [db_password, phoenix_api_key, gemini_api_key]
    ports: ["127.0.0.1:8790:8790"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8790/healthz', timeout=3)"]
      interval: 5s
      retries: 20

secrets:
  db_password: {file: .secrets/db-password}
  gemini_api_key: {file: .secrets/secrets/gemini_api_key}
  tavily_api_key: {file: .secrets/secrets/tavily_api_key}
  openrouter_api_key: {file: .secrets/secrets/openrouter_api_key}
  litellm_master_key: {file: .secrets/secrets/litellm_master_key}
  phoenix_api_key: {file: .secrets/phoenix-api-key}

volumes:
  pgdata:
    name: agentbreeder-northwind-pg
    external: true   # created by up.sh; survives `docker compose down`
