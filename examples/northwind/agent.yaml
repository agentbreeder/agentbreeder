# Northwind customer support agent, built entirely from registry references.
# No agent Python here: the ADK runtime (runtime/adk) and the tool packages under registry/
# provide the code. See docs/agent-yaml.md and examples/northwind/README.md.
kind: agent
schema_version: 1
name: northwind-support
runtime: runtime/adk@1.0.1
description: Customer support for Northwind Notes and the Northwind Pen.

model:
  alias: support-model          # LiteLLM alias: Gemini direct, OpenRouter fallback (stack/litellm)
  reasoning: low
  max_model_calls: 4
  budget_usd: 25
  rpm: 120

prompt: {ref: prompt/northwind-support@1.0.0}

knowledge:
  - {ref: knowledge/northwind-help@1.0.0, top_k: 5, extra_searches: 1}

tools:
  - {ref: tool/customer-notes@1.0.0}
  - {ref: tool/escalate-to-human@1.0.0}
  - {ref: tool/orders@1.0.0}
  - {ref: tool/cancel-order@1.0.0}      # files a request; staff approve in the ops dashboard
  - {ref: tool/web-search@1.0.0}

memory: {sessions: postgres, notes: true}
agent_events: postgres
traces: otlp

evals: {ref: eval/northwind-golden@1.0.0, threshold: 1.0, retries: 1}
