<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Source of public/og.png (design v2 §7, DS13): stays dark, because social cards render
       outside the site's theme. #0a0a0a, a white Geist title, the mark with its green gate line.
       Rendered with Geist Sans and Geist Mono (the `geist` package) at 1280 x 640. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="640" fill="url(#fade)"/></mask>
    <radialGradient id="wash" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>
  <rect width="1280" height="640" fill="url(#wash)"/>
  <rect width="1280" height="640" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- the mark: gate-line hexagon in green, nodes in near-white -->
  <g transform="translate(96, 88) scale(0.72)">
    <polygon points="86,50 68,81 32,81 14,50 32,19 68,19" fill="none" stroke="#22c55e" stroke-width="6" stroke-linejoin="round"/>
    <g stroke="#ededed" stroke-width="4" stroke-linecap="round">
      <line x1="50" y1="50" x2="33" y2="34"/>
      <line x1="50" y1="50" x2="67" y2="34"/>
      <line x1="50" y1="50" x2="33" y2="66"/>
      <line x1="50" y1="50" x2="67" y2="66"/>
    </g>
    <g fill="#ededed">
      <circle cx="50" cy="50" r="8"/>
      <circle cx="33" cy="34" r="5.5"/>
      <circle cx="67" cy="34" r="5.5"/>
      <circle cx="33" cy="66" r="5.5"/>
      <circle cx="67" cy="66" r="5.5"/>
    </g>
  </g>
  <text x="184" y="134" font-family="Geist, sans-serif" font-size="30" font-weight="600" fill="#ededed" letter-spacing="-0.6">agentbreeder</text>

  <text x="96" y="236" font-family="'Geist Mono', monospace" font-size="22" fill="#a3a3a3">open-source preview · apache 2.0</text>

  <g font-family="Geist, sans-serif" font-size="84" font-weight="600" fill="#ededed" letter-spacing="-3.4">
    <text x="92" y="338">Know the agent.</text>
    <text x="92" y="432">Gate the deploy.</text>
    <text x="92" y="526">Audit every attempt.</text>
  </g>
  <!-- the gate line under "Gate the deploy.", running on past the gate -->
  <line x1="96" y1="450" x2="1184" y2="450" stroke="#22c55e" stroke-width="3"/>
  <circle cx="1184" cy="450" r="7" fill="#0a0a0a" stroke="#22c55e" stroke-width="3"/>

  <text x="96" y="596" font-family="'Geist Mono', monospace" font-size="20" fill="#a3a3a3">agentbreeder.io</text>
  <text x="1184" y="596" font-family="'Geist Mono', monospace" font-size="20" fill="#a3a3a3" text-anchor="end">github.com/agentbreeder/agentbreeder</text>
</svg>
