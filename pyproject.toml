[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbreeder"
version = "0.0.0.dev0"
description = "Development foundation for deploying existing agents in customer infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.14.2,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
cedar = ["cedarpy==4.12.2"]
aws = ["boto3>=1.40,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2", "cryptography>=44", "cedarpy==4.12.2"]

[project.scripts]
agentbreeder = "agentbreeder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbreeder = ["policy/cedar_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "entra_live: live Microsoft Entra tenant test (needs AGENTBREEDER_ENTRA_LIVE credentials)",
]

[tool.ruff]
target-version = "py311"
line-length = 99
# 100xprism-generated harness catalogs: regenerated by `100xprism update`, never hand-edited.
extend-exclude = [".agents", ".codex", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
