[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbreeder"
dynamic = ["version"]
description = "Preview: build, gate and deploy agents with a deploy-time identity gate and audit trail"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["pydantic>=2.13.4,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
cedar = ["cedarpy==4.12.2"]
aws = ["boto3>=1.40,<2"]
# `agentbreeder eval` / `release` fixture resets (eval sets with fixtures.sql).
eval = ["psycopg[binary]==3.3.6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2", "cryptography>=44", "cedarpy==4.12.2", "psycopg[binary]==3.3.6"]

[project.urls]
Homepage = "https://www.agentbreeder.io"
Documentation = "https://www.agentbreeder.io/docs"
Source = "https://github.com/agentbreeder/agentbreeder"
"Legacy 2.x" = "https://www.agentbreeder.io/docs/legacy-2x"

[project.scripts]
agentbreeder = "agentbreeder.cli:main"

[tool.setuptools.dynamic]
version = {attr = "agentbreeder.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbreeder = [
    "policy/cedar_schema.json",
    # Shipped registry versions (the ADK runtime). Its runtime_tests need google-adk and run
    # separately; build.py copies only the runtime's Dockerfile and runtime/ into a build
    # context, so they never reach an image (they are still part of the hashed version).
    "builtin_registry/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "entra_live: live Microsoft Entra tenant test (needs AGENTBREEDER_ENTRA_LIVE credentials)",
]

[tool.ruff]
target-version = "py311"
line-length = 99
# 100xprism-generated harness catalogs: regenerated by `100xprism update`, never hand-edited.
extend-exclude = [
    ".agents",
    ".codex",
    ".cursor",
    # Example infrastructure copied from the reference agent (not AgentBreeder product code).
    "examples/northwind/stack",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
