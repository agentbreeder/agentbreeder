kind: runtime
name: adk
version: 1.0.5
description: >-
  AgentBreeder's maintained Google ADK runtime (google-adk 2.12.0, LiteLLM gateway client
  litellm 1.108.3). Driven by a data-only agent.config.json generated by `agentbreeder build`. ADK sessions live
  in the `adk_sessions` schema of the agent's own database, so one DATABASE_URL is enough.
framework: google-adk
port: 8080
health_path: /health
secrets: [DATABASE_URL, LLM_GATEWAY_KEY]
environment: [AGENTBREEDER_GATEWAY_URL, AGENTBREEDER_SERVICE_TRACES_URL,
  AGENTBREEDER_SERVICE_TOOLS_PROXY_URL, AGENTBREEDER_SESSIONS_SCHEMA]
