kind: runtime
name: adk
version: 1.4.0
description: >-
  AgentBreeder's maintained Google ADK runtime (google-adk 2.12.0, LiteLLM gateway client
  litellm 1.108.3). Driven by a data-only agent.config.json generated by `agentbreeder build`. ADK sessions live
  in the `adk_sessions` schema of the agent's own database, so one DATABASE_URL is enough.
  If the database owner pre-created the runtime's tables (notes, tickets, turns, audit_events)
  and the sessions schema, the runtime runs no DDL on them, so its role needs only the grants
  it uses. An agent's `mcp:` tools are called through the stack's MCP relay (one ADK
  McpToolset per server, tools named <server>_<tool>). 1.2.0 adds `cost_usd` to each reply (the
  gateway's x-litellm-response-cost summed over the turn's model calls), `agent`, `tool` and
  `latency_ms` on every tool event (one event per call, failed calls included), and refuses a
  tool whose src/ would shadow an installed module or another tool's module. The root
  `agent_turn` span carries `agentbreeder.deployment_id` when AGENTBREEDER_DEPLOYMENT_ID is set.
  1.3.0 returns a failed model call as a fixed coded error (MODEL_BUDGET_EXCEEDED,
  MODEL_RATE_LIMITED with retry_after_s, MODEL_ACCESS_DENIED, MODEL_REQUEST_REFUSED,
  MODEL_UNAVAILABLE) with a correlation_id, never the gateway's text, which goes redacted to
  the log; waits on a rate limit only up to 10 s per turn; and reports `fallbacks` and
  `served_by` (the aliases that answered) when a gateway fallback served the turn.
  1.4.0 adds `cached_prompt_tokens` (prompt tokens the provider read from its cache, as the
  gateway reported them) to each reply, model_called event and root span; lists a tool name the
  model invented under `unknown_tools` (with one `tool_unknown` event), never as a tool call;
  and answers a gateway guardrail block as MODEL_BLOCKED (HTTP 422) with a `guardrail_blocked`
  event and root span attributes naming the guardrail and entity type, never the matched text.
framework: google-adk
port: 8080
health_path: /health
capabilities: [mcp]
# The memory schema version this runtime writes (M16 refuses unknown ones; 1 = every earlier
# version, implied).
memory_schema: 2
secrets: [DATABASE_URL, LLM_GATEWAY_KEY]
# Per mcp: server, deploy also mounts AGENTBREEDER_MCP_<NAME>_TOKEN and sets
# AGENTBREEDER_MCP_<NAME>_URL.
environment: [AGENTBREEDER_GATEWAY_URL, AGENTBREEDER_SERVICE_TRACES_URL,
  AGENTBREEDER_SERVICE_TOOLS_PROXY_URL, AGENTBREEDER_SESSIONS_SCHEMA,
  AGENTBREEDER_DEPLOYMENT_ID]
