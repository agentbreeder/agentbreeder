kind: runtime
name: adk
version: 1.1.0
description: >-
  AgentBreeder's maintained Google ADK runtime (google-adk 2.12.0, LiteLLM gateway client
  litellm 1.108.3). Driven by a data-only agent.config.json generated by `agentbreeder build`. ADK sessions live
  in the `adk_sessions` schema of the agent's own database, so one DATABASE_URL is enough.
  If the database owner pre-created the runtime's tables (notes, tickets, turns, audit_events)
  and the sessions schema, the runtime runs no DDL on them, so its role needs only the grants
  it uses. An agent's `mcp:` tools are called through the stack's MCP relay (one ADK
  McpToolset per server, tools named <server>_<tool>).
framework: google-adk
port: 8080
health_path: /health
capabilities: [mcp]
secrets: [DATABASE_URL, LLM_GATEWAY_KEY]
# Per mcp: server, deploy also mounts AGENTBREEDER_MCP_<NAME>_TOKEN and sets
# AGENTBREEDER_MCP_<NAME>_URL.
environment: [AGENTBREEDER_GATEWAY_URL, AGENTBREEDER_SERVICE_TRACES_URL,
  AGENTBREEDER_SERVICE_TOOLS_PROXY_URL, AGENTBREEDER_SESSIONS_SCHEMA]
