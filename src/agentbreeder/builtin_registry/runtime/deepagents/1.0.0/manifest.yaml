kind: runtime
name: deepagents
version: 1.0.0
description: >-
  AgentBreeder's Deep Agents runtime (deepagents 0.7.32 on langgraph 1.2.19, langchain 1.4.8,
  langchain-openai 1.7.3), on the shared runtime kit (kit 1.0.0, vendored in runtime/kit/). It
  builds the agent from the data-only agent.config.json that `agentbreeder build` generates: the
  prompt, model alias, registry tools, knowledge and notes mean what they mean on
  runtime/adk@1.3.0. The agent is create_deep_agent with the state backend only: the model is
  also offered Deep Agents' file tools (ls, read_file, write_file, edit_file, delete, glob, grep),
  which act on the turn's in-memory state and never on a disk, and the `task` sub-agent. There is
  no execute tool and no checkpointer; history is the conversation's user and assistant text from
  the agent's own `turns` table. Deep Agents reaches models only through the kit's loopback model
  proxy, which holds the gateway key and owns retries, the cost tally, coded model errors (as
  1.3.0), the model alias and the step cap; the `task` sub-agent's calls count against the same
  cap, and its calls to the agent's tools are audited as the agent's. The built-in tools'
  descriptions add about 2.6k prompt tokens per call (F0). /health is 503 until the agent is
  built. No MCP, AgentBreeder sub-agents or skills in this version. Not run end to end on a real
  stack yet.
# The agent protocol this runtime serves and what the engine may build for it (#1083 F1, F5).
protocol: 1
profile: kit
kit: 1.0.0
framework: deepagents
display_name: Deep Agents
model_api: openai-chat
port: 8080
health_path: /health
capabilities: [knowledge, notes]
limits: {knowledge: 1, tools: 50, mcp_servers: 0}
# The knowledge tool the kit adds when the agent has knowledge, and Deep Agents 0.7.32's built-in
# tools with the state backend (F0; multi-framework spec §8.3).
reserved_tool_names: [search_knowledge_base, ls, read_file, write_file, edit_file, delete, glob,
  grep, task]
docs: docs/runtimes/deepagents.md
# The memory schema version this runtime writes: runtime/adk@1.3.0's tables, unchanged.
memory_schema: 2
secrets: [DATABASE_URL, LLM_GATEWAY_KEY]
environment: [AGENTBREEDER_GATEWAY_URL, AGENTBREEDER_SERVICE_TRACES_URL,
  AGENTBREEDER_SERVICE_TOOLS_PROXY_URL, AGENTBREEDER_DEPLOYMENT_ID]
