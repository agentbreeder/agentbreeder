image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
# The image's own entrypoint and user (uid 1001). No auth: the port is internal, so only
# other stack services (the gateway) reach it, never agent containers or the host.
ports:
  http: {port: 3000}
env:
  HOME: /tmp
  WORKERS: "1"
health: {http: /health}
egress: false
outputs:
  url: {type: url, port: http}
