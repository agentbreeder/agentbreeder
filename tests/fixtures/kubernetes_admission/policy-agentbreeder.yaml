# AgentBreeder policy objects for namespace agentbreeder (#770 §7).
# Digest: sha256:fe04b59625796b206086812de82aa4f80321fbbee028cb2281b8cef92c66ff99
# Needs Kubernetes 1.30 or later and the ab-grants ConfigMap in the namespace.
# The policy names are cluster-wide: one AgentBreeder namespace per cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ab-deployments
  labels:
    app.kubernetes.io/managed-by: agentbreeder
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agentbreeder
    objectSelector: {}
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - '*'
      resources:
      - deployments
      - deployments/scale
      operations:
      - CREATE
      - UPDATE
      - DELETE
      scope: Namespaced
  matchConditions:
  - name: agentbreeder-identities
    expression: request.userInfo.username in ['system:serviceaccount:agentbreeder:ab-deployer', 'system:serviceaccount:agentbreeder:ab-canary']
  variables:
  - name: isDeployer
    expression: request.userInfo.username == 'system:serviceaccount:agentbreeder:ab-deployer'
  - name: isCanary
    expression: request.userInfo.username == 'system:serviceaccount:agentbreeder:ab-canary'
  - name: agent
    expression: object.metadata.labels['io.agentbreeder/name']
  - name: id
    expression: object.metadata.labels['io.agentbreeder/deployment']
  - name: granted
    expression: (variables.agent + '.bindings') in params.data
  - name: uses
    expression: 'params.data[variables.agent + ''.uses''] == '''' ? [] : params.data[variables.agent +
      ''.uses''].split('','')'
  - name: bindings
    expression: 'params.data[variables.agent + ''.bindings''] == '''' ? [] : params.data[variables.agent
      + ''.bindings''].split('','')'
  - name: stores
    expression: 'params.data[variables.agent + ''.stores''] == '''' ? [] : params.data[variables.agent
      + ''.stores''].split('','')'
  - name: sas
    expression: 'params.data[variables.agent + ''.sa''] == '''' ? [] : params.data[variables.agent + ''.sa''].split('','')'
  - name: services
    expression: variables.uses.map(u, u.split(':')[0])
  - name: labelKeys
    expression: '[''app.kubernetes.io/managed-by'', ''io.agentbreeder/deployment'', ''io.agentbreeder/name'']
      + variables.services.map(s, ''io.agentbreeder/uses-'' + s)'
  - name: blocked
    expression: 'params.data.blocked == '''' ? [] : params.data.blocked.split('','')'
  - name: kit
    expression: 'params.data.kit == '''' ? [] : params.data.kit.split('';'')'
  - name: pod
    expression: object.spec.template.spec
  validations:
  - expression: variables.isDeployer
    message: only the deployer may write Deployments
  - expression: request.operation != 'UPDATE'
    message: updates are refused; AgentBreeder replaces objects
  - expression: request.operation != 'CREATE' || (object.metadata.name.matches('^agentbreeder-[0-9a-f]{32}$')
      && object.metadata.name == 'agentbreeder-' + variables.id)
    message: the name must be agentbreeder-<the deployment label>
  - expression: request.operation != 'CREATE' || (has(object.metadata.labels) && object.metadata.labels.all(k,
      k in variables.labelKeys) && 'app.kubernetes.io/managed-by' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by']
      == 'agentbreeder' && 'io.agentbreeder/deployment' in object.metadata.labels && object.metadata.labels['io.agentbreeder/deployment'].matches('^[0-9a-f]{32}$')
      && 'io.agentbreeder/name' in object.metadata.labels && object.metadata.labels['io.agentbreeder/name'].matches('^[a-z0-9][a-z0-9-]{0,62}$')
      && object.metadata.labels.all(k, !k.startsWith('io.agentbreeder/uses-') || object.metadata.labels[k]
      == 'true'))
    message: labels must be exactly AgentBreeder's deployment labels
  - expression: request.operation != 'CREATE' || (variables.granted)
    message: the agent named by io.agentbreeder/name has no entry in ab-grants
  - expression: request.operation != 'CREATE' || ((!has(object.metadata.finalizers) || size(object.metadata.finalizers)
      == 0))
    message: finalizers are refused
  - expression: request.operation != 'CREATE' || ((!has(object.metadata.ownerReferences) || size(object.metadata.ownerReferences)
      == 0))
    message: ownerReferences are refused
  - expression: 'request.operation != ''CREATE'' || ((object.spec.all(k, k in [''replicas'', ''strategy'',
      ''revisionHistoryLimit'', ''progressDeadlineSeconds'', ''selector'', ''template''])) && (''replicas''
      in object.spec && object.spec[''replicas''] == 1) && ((!(''strategy'' in object.spec) || object.spec[''strategy'']
      == {''type'': dyn(''RollingUpdate''), ''rollingUpdate'': dyn({''maxUnavailable'': ''25%'', ''maxSurge'':
      ''25%''})})) && ((!(''revisionHistoryLimit'' in object.spec) || object.spec[''revisionHistoryLimit'']
      == 10)) && ((!(''progressDeadlineSeconds'' in object.spec) || object.spec[''progressDeadlineSeconds'']
      == 600)))'
    message: spec may hold only replicas 1, the selector and the template
  - expression: 'request.operation != ''CREATE'' || (object.spec.selector == {''matchLabels'': {''io.agentbreeder/deployment'':
      variables.id}})'
    message: the selector must be the deployment label only
  - expression: request.operation != 'CREATE' || (object.spec.template.all(k, k in ['metadata', 'spec'])
      && (object.spec.template.metadata.all(k, k in ['creationTimestamp', 'labels'])) && ((!('creationTimestamp'
      in object.spec.template.metadata) || object.spec.template.metadata['creationTimestamp'] == null))
      && object.spec.template.metadata.labels == object.metadata.labels)
    message: pod labels must equal the Deployment's; pod annotations are refused
  - expression: request.operation != 'CREATE' || (variables.pod.all(k, k in ['automountServiceAccountToken',
      'enableServiceLinks', 'securityContext', 'containers', 'volumes', 'serviceAccountName', 'serviceAccount',
      'imagePullSecrets', 'restartPolicy', 'dnsPolicy', 'schedulerName', 'terminationGracePeriodSeconds']))
    message: a pod field outside AgentBreeder's template is refused
  - expression: 'request.operation != ''CREATE'' || (''automountServiceAccountToken'' in variables.pod
      && variables.pod.automountServiceAccountToken == false && ''enableServiceLinks'' in variables.pod
      && variables.pod.enableServiceLinks == false && ''securityContext'' in variables.pod && variables.pod.securityContext
      == {''runAsNonRoot'': dyn(true), ''runAsUser'': dyn(65532), ''runAsGroup'': dyn(65532), ''fsGroup'':
      dyn(65532), ''seccompProfile'': dyn({''type'': ''RuntimeDefault''})})'
    message: the pod security context must be AgentBreeder's
  - expression: request.operation != 'CREATE' || ((!('restartPolicy' in variables.pod) || variables.pod['restartPolicy']
      == 'Always') && (!('dnsPolicy' in variables.pod) || variables.pod['dnsPolicy'] == 'ClusterFirst')
      && (!('schedulerName' in variables.pod) || variables.pod['schedulerName'] == 'default-scheduler')
      && (!('terminationGracePeriodSeconds' in variables.pod) || variables.pod['terminationGracePeriodSeconds']
      == 30))
    message: restartPolicy, dnsPolicy, schedulerName and the grace period must be the defaults
  - expression: request.operation != 'CREATE' || ((!('serviceAccountName' in variables.pod) || variables.pod.serviceAccountName
      == 'default' || variables.pod.serviceAccountName in variables.sas) && (!('serviceAccount' in variables.pod)
      || ('serviceAccountName' in variables.pod && variables.pod.serviceAccount == variables.pod.serviceAccountName)))
    message: the pod may run only as default or the agent's granted service account
  - expression: 'request.operation != ''CREATE'' || (!(''imagePullSecrets'' in variables.pod) || (params.data.pull
      != '''' && variables.pod.imagePullSecrets == [{''name'': params.data.pull}]))'
    message: imagePullSecrets may name only the granted pull Secret
  - expression: 'request.operation != ''CREATE'' || ((size(variables.pod.containers) == 1 || (size(variables.pod.containers)
      == 2 && ((variables.pod.containers[1].all(k, k in [''name'', ''imagePullPolicy'', ''env'', ''securityContext'',
      ''resources'', ''volumeMounts'', ''terminationMessagePath'', ''terminationMessagePolicy'', ''image'']))
      && (''name'' in variables.pod.containers[1] && variables.pod.containers[1][''name''] == ''cli'')
      && (''imagePullPolicy'' in variables.pod.containers[1] && variables.pod.containers[1][''imagePullPolicy'']
      == ''IfNotPresent'') && (''env'' in variables.pod.containers[1] && variables.pod.containers[1][''env'']
      == [{''name'': ''AGENTBREEDER_ROLE'', ''value'': ''cli-host''}]) && (''securityContext'' in variables.pod.containers[1]
      && variables.pod.containers[1][''securityContext''] == {''runAsUser'': dyn(65533), ''runAsGroup'':
      dyn(65533), ''allowPrivilegeEscalation'': dyn(false), ''readOnlyRootFilesystem'': dyn(true), ''capabilities'':
      dyn({''drop'': [''ALL'']})}) && (''resources'' in variables.pod.containers[1] && variables.pod.containers[1][''resources'']
      == {''requests'': {''cpu'': ''100m'', ''memory'': ''128Mi''}, ''limits'': {''cpu'': ''1'', ''memory'':
      ''512Mi''}}) && (''volumeMounts'' in variables.pod.containers[1] && variables.pod.containers[1][''volumeMounts'']
      == [dyn({''name'': ''cli-tmp'', ''mountPath'': ''/tmp''}), dyn({''name'': dyn(''cli-shared''), ''mountPath'':
      dyn(''/run/agentbreeder-cli''), ''readOnly'': dyn(true)})]) && ((!(''terminationMessagePath'' in
      variables.pod.containers[1]) || variables.pod.containers[1][''terminationMessagePath''] == ''/dev/termination-log''))
      && ((!(''terminationMessagePolicy'' in variables.pod.containers[1]) || variables.pod.containers[1][''terminationMessagePolicy'']
      == ''File'')) && variables.pod.containers[1].image == variables.pod.containers[0].image))) && variables.pod.containers[0].name
      == ''agent'')'
    message: the pod holds the agent container (and, for two-uid runtimes, the cli container) only
  - expression: 'request.operation != ''CREATE'' || (variables.pod.containers[0].all(k, k in [''name'',
      ''image'', ''imagePullPolicy'', ''ports'', ''env'', ''securityContext'', ''resources'', ''readinessProbe'',
      ''volumeMounts'', ''terminationMessagePath'', ''terminationMessagePolicy'']) && ''imagePullPolicy''
      in variables.pod.containers[0] && variables.pod.containers[0].imagePullPolicy == ''IfNotPresent''
      && ''securityContext'' in variables.pod.containers[0] && variables.pod.containers[0].securityContext
      == {''allowPrivilegeEscalation'': dyn(false), ''readOnlyRootFilesystem'': dyn(true), ''capabilities'':
      dyn({''drop'': [''ALL'']})} && ''resources'' in variables.pod.containers[0] && variables.pod.containers[0].resources
      == {''requests'': {''cpu'': ''100m'', ''memory'': ''128Mi''}, ''limits'': {''cpu'': ''1'', ''memory'':
      ''512Mi''}} && (!(''terminationMessagePath'' in variables.pod.containers[0]) || variables.pod.containers[0][''terminationMessagePath'']
      == ''/dev/termination-log'') && (!(''terminationMessagePolicy'' in variables.pod.containers[0])
      || variables.pod.containers[0][''terminationMessagePolicy''] == ''File''))'
    message: the agent container must be AgentBreeder's (no command, args, envFrom or probes but readiness)
  - expression: request.operation != 'CREATE' || (size(variables.pod.containers[0].ports) == 1 && (variables.pod.containers[0].ports[0].all(k,
      k in ['protocol', 'containerPort'])) && ('protocol' in variables.pod.containers[0].ports[0] && variables.pod.containers[0].ports[0]['protocol']
