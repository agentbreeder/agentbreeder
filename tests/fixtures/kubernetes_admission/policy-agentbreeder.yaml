    message: the agent container has exactly one TCP port
  - expression: request.operation != 'CREATE' || ('readinessProbe' in variables.pod.containers[0] && (variables.pod.containers[0].readinessProbe.all(k,
      k in ['periodSeconds', 'failureThreshold', 'timeoutSeconds', 'successThreshold', 'httpGet'])) &&
      ('periodSeconds' in variables.pod.containers[0].readinessProbe && variables.pod.containers[0].readinessProbe['periodSeconds']
      == 2) && ('failureThreshold' in variables.pod.containers[0].readinessProbe && variables.pod.containers[0].readinessProbe['failureThreshold']
      == 30) && ((!('timeoutSeconds' in variables.pod.containers[0].readinessProbe) || variables.pod.containers[0].readinessProbe['timeoutSeconds']
      == 1)) && ((!('successThreshold' in variables.pod.containers[0].readinessProbe) || variables.pod.containers[0].readinessProbe['successThreshold']
      == 1)) && (variables.pod.containers[0].readinessProbe.httpGet.all(k, k in ['scheme', 'path', 'port']))
      && ((!('scheme' in variables.pod.containers[0].readinessProbe.httpGet) || variables.pod.containers[0].readinessProbe.httpGet['scheme']
      == 'HTTP')) && variables.pod.containers[0].readinessProbe.httpGet.port == variables.pod.containers[0].ports[0].containerPort)
    message: the readiness probe is an HTTP GET of the agent's port only
  - expression: request.operation != 'CREATE' || (variables.pod.containers[0].image.startsWith(params.data.registry
      + '/' + variables.agent + '@sha256:') && size(variables.pod.containers[0].image) == size(params.data.registry
      + '/' + variables.agent) + 72 && variables.pod.containers[0].image.matches('@sha256:[0-9a-f]{64}$'))
    message: the image must be <registry>/<agent>@sha256:<digest>
  - expression: request.operation != 'CREATE' || (!('env' in variables.pod.containers[0]) || variables.pod.containers[0].env.all(e,
      e.all(k, k in ['name', 'value'])))
    message: environment variables are literal values only (no valueFrom)
  - expression: 'request.operation != ''CREATE'' || (variables.pod.containers[0].volumeMounts.all(m, m.all(k,
      k in [''name'', ''mountPath'', ''readOnly'']) && (m == {''name'': ''tmp'', ''mountPath'': ''/tmp''}
      || m == {''name'': dyn(''secrets''), ''mountPath'': dyn(''/run/secrets''), ''readOnly'': dyn(true)}
      || m == {''name'': ''cli-shared'', ''mountPath'': ''/run/agentbreeder-cli''} || (m.name.startsWith(''store-'')
      && ''readOnly'' in m && m.readOnly == true && m.mountPath == ''/run/secret-store/'' + m.name.substring(6)))))'
    message: a volume mount outside AgentBreeder's template is refused
  - expression: 'request.operation != ''CREATE'' || (variables.pod.volumes.all(v, v == {''name'': dyn(''tmp''),
      ''emptyDir'': dyn({''medium'': ''Memory'', ''sizeLimit'': ''64Mi''})} || v == {''name'': dyn(''cli-tmp''),
      ''emptyDir'': dyn({''medium'': ''Memory'', ''sizeLimit'': ''64Mi''})} || v == {''name'': dyn(''cli-shared''),
      ''emptyDir'': dyn({''medium'': ''Memory'', ''sizeLimit'': ''1Mi''})} || (v.name == ''secrets'' &&
      v.all(k, k in [''name'', ''projected'']) && (v.projected.all(k, k in [''defaultMode'', ''sources'']))
      && (''defaultMode'' in v.projected && v.projected[''defaultMode''] == 288) && v.projected.sources.all(s,
      size(s) == 1 && ((''secret'' in s && s.secret == {''name'': object.metadata.name}) || (''secret''
      in s && s.secret.all(k, k in [''name'', ''items'']) && s.secret.name in variables.bindings && (!(''items''
      in s.secret) || s.secret.items.all(i, i.all(k, k in [''key'', ''path''])))) || (''downwardAPI''
      in s && s.downwardAPI.all(k, k == ''items'') && s.downwardAPI.items.all(i, i.all(k, k in [''path'',
      ''fieldRef'']) && i.fieldRef.all(k, k in [''apiVersion'', ''fieldPath'']) && i.fieldRef.fieldPath
      in [''metadata.name'', ''metadata.labels'']))))) || (v.all(k, k in [''name'', ''csi'']) && v.csi.all(k,
      k in [''driver'', ''readOnly'', ''volumeAttributes'']) && v.csi.driver == ''secrets-store.csi.k8s.io''
      && v.csi.readOnly == true && v.csi.volumeAttributes.all(k, k == ''secretProviderClass'') && v.csi.volumeAttributes.secretProviderClass
      in variables.stores && v.name == ''store-'' + v.csi.volumeAttributes.secretProviderClass)))'
