  - expression: request.operation != 'CREATE' || (object.metadata.annotations.all(k, k in ['io.agentbreeder/spec',
      'io.agentbreeder/image']) && size(object.metadata.annotations) == 2 && object.metadata.annotations['io.agentbreeder/image']
      == variables.pod.containers[0].image)
