data:
  agentbreeder_request_filter.py: |
    """AgentBreeder's request filter for the built-in gateway (#1105, #1089), loaded by files/start.py.

    A model alias's provider, endpoint and credentials come from the reviewed gateway config only.
    LiteLLM's router merges request fields over a deployment's `litellm_params`, so this filter
    refuses, before any provider call:

    - a request carrying a provider-routing, endpoint or credential field (`ROUTING_FIELDS`) at the
      top level, in `extra_body`, `litellm_embedding_config` or a request-level fallback target
      (`GATEWAY_PARAM_REFUSED`). Metadata is not scanned: the router does not route from it, the
      proxy writes its own keys there (`headers`, `user_api_key_*`), and LiteLLM's blocklist already
      covers its endpoint and credential names in metadata;
    - any call type other than chat completions, embeddings and Anthropic messages that reaches this
      hook (provider pass-through, file upload, responses and the rest; `GATEWAY_ROUTE_REFUSED`).
      Routes that never call the hook are closed by the deployment key's `allowed_routes`.

    1.4.0 (#1089) serves LiteLLM's Anthropic Messages route (`/v1/messages`, call type
    `anthropic_messages`) for the Claude Agent SDK runtime. Chat completions and embeddings are
    decided exactly as in 1.3.0. A Messages request gets every check above, and is also refused
    (`GATEWAY_PARAM_REFUSED`) when it reaches provider-side tools, execution or storage, or picks a
    provider tier or region (read from LiteLLM 1.106.2's `/v1/messages` path):

    - `mcp_servers`: the provider connects to remote MCP servers from its own network;
    - `container`: a provider code-execution container and its skills;
    - `service_tier`, `speed`: a provider capacity tier or fast mode, priced outside the alias's
      configured model and not checked against LiteLLM's cost map;
    - `inference_geo`: the provider region (1.3.0 refuses `region_name` and the like);
    - `betas`, `anthropic_beta`: beta flags switch on server tools and the Files API (LiteLLM adds
      the betas its own features need);
    - `compaction`, `safeguards`: provider-side features LiteLLM turns into beta flags, which no
      AgentBreeder runtime sends;
    - `tools` with any `type` but `custom`: provider server tools (web search and fetch, code
      execution, tool search), Anthropic-defined tools (computer, bash, text editor, memory), MCP
      toolsets, LiteLLM's MCP gateway (`mcp`) and advisor tools (a second model call, with
      credentials it can take from the tool). A client tool passes when it has only CLIENT_TOOL_KEYS
      (so no `allowed_callers`, which hands a tool to code execution); `tools` that is not a list of
      objects is refused;
    - `provider_specific_header` carrying anything but `anthropic-version`: LiteLLM copies the
      `anthropic-beta` header and an Anthropic OAuth `Authorization` there, and sends it to the
      provider; a caller can also send the field in the body;
    - a content block in `messages` or `system` (and in a `tool_result`'s or a document's nested
      content) that is a `container_upload`, or whose `source` is a Files API id (`file`: a file in
      the gateway's provider account, which every key shares) or a `url` the provider would fetch
      from its own network. Only the content-block structure is read, never a `tool_use` input or
      text; content nested deeper than the filter reads is refused.

    `metadata` on this route is Anthropic's own (`user_id`); the proxy's is `litellm_metadata`.
    Neither is scanned, as on chat.

    Not covered: `/v1/messages/count_tokens`. LiteLLM matches a key's `allowed_routes` by prefix, so
    a key allowed `/v1/messages` reaches it, and its handler calls no pre-call hook.

    Top-level fields the proxy itself can add (`api_key`, `headers`, `organization`) only appear when
    `general_settings` turns on header forwarding, which the gateway config review refuses; the
    `api-version` query parameter becomes `api_version` and is refused like the body field.

    The refusal is a 400 whose detail starts with the code. One log line per refusal names the code,
    the field, where it was, the call type and the key alias; never a value or key material.
    LiteLLM's own blocklist (`api_base`, `base_url`, ...) still runs first.
    """

    import json
    import re
    import sys

    from fastapi import HTTPException
    from litellm.integrations.custom_logger import CustomLogger

    # Fields that choose a provider, a deployment, an endpoint, a credential or a provider tenant.
    ROUTING_FIELDS = frozenset(
        {
            # provider and deployment selection
            "custom_llm_provider",
            "litellm_credential_name",
            "specific_deployment",
            "model_id",
            "deployment_id",
            "use_litellm_proxy",
            "use_in_pass_through",
            "use_chat_completions_api",
            "litellm_params",
            # endpoints (LiteLLM refuses most of these too)
            "api_base",
            "base_url",
            "api_type",
            "api_version",
            "user_config",
            "aws_bedrock_runtime_endpoint",
            "aws_sts_endpoint",
            # credentials and the headers that carry them
            "api_key",
            "organization",
            "extra_headers",
            "headers",
            "aws_access_key_id",
            "aws_secret_access_key",
            "aws_session_token",
            "aws_session_name",
            "aws_profile_name",
            "aws_role_name",
            "aws_web_identity_token",
            "azure_ad_token",
            "azure_ad_token_provider",
            "azure_username",
            "azure_password",
            "azure_scope",
            "client_id",
            "client_secret",
            "tenant_id",
            "vertex_credentials",
            "vertex_ai_credentials",
            "gigachat_access_token",
            "gigachat_auth_url",
            "gigachat_scope",
            "ssl_verify",
            # the rest of LiteLLM 1.106.2's CredentialLiteLLMParams (litellm/types/router.py)
            "aws_external_id",
            "aws_session_tags",
            "aws_bedrock_project_id",
            "aws_batch_role_arn",
            "gcs_bucket_name",
            "bucket_name",
            "s3_bucket_name",
            "s3_endpoint_url",
            "s3_region_name",
            "s3_access_key_id",
            "s3_secret_access_key",
            "s3_encryption_key_id",
            "s3_bucket_owner",
            "s3_output_bucket_name",
            "bedrock_tags",
            "watsonx_region_name",
            "anthropic_federation_rule_id",
            "anthropic_organization_id",
            "anthropic_service_account_id",
            "anthropic_federation_workspace_id",
            "anthropic_identity_token_file",
            "anthropic_identity_token",
            "anthropic_identity_source",
            "anthropic_issuer_url",
            "anthropic_issuer_subject",
            "anthropic_issuer_audience",
            "anthropic_issuer_ttl_seconds",
            "anthropic_issuer_signing_key_ref",
            "anthropic_keycloak_token_url",
            "anthropic_keycloak_client_id",
            "anthropic_keycloak_auth_method",
            "anthropic_keycloak_client_secret_ref",
            "anthropic_keycloak_scope",
            "anthropic_disable_workload_identity_federation",
            "openai_identity_provider_id",
            "openai_service_account_id",
            "openai_identity_token_file",
            # credential and endpoint names LiteLLM's providers read from request kwargs
            "anthropic_workspace_id",
            "aws_workspace_id",
            "azure_endpoint",
            "azure_authority_host",
            "azure_client_id",
            "azure_tenant_id",
            "gcs_path_service_account",
            "watsonx_credentials",
            "watsonx_token",
            # provider tenancy and region
            "region_name",
            "aws_region_name",
            "vertex_project",
            "vertex_location",
            "vertex_ai_project",
            "vertex_ai_location",
        }
    )
    # LiteLLM's call types for chat completions, embeddings and Anthropic messages (streaming
    # included).
    MESSAGES_CALL_TYPES = frozenset({"anthropic_messages", "aanthropic_messages"})
    ALLOWED_CALL_TYPES = (
        frozenset({"acompletion", "completion", "aembedding", "embeddings"}) | MESSAGES_CALL_TYPES
    )
    # Anthropic Messages fields refused on the Messages route (see the module docstring).
    MESSAGES_REFUSED_FIELDS = frozenset(
        {
            "mcp_servers",
            "container",
            "service_tier",
            "speed",
            "inference_geo",
            "betas",
            "anthropic_beta",
            "compaction",
            "safeguards",
        }
    )
    # The keys a client tool may have (Anthropic's custom tool, without `allowed_callers`).
    CLIENT_TOOL_KEYS = frozenset(
        {
            "type",
            "name",
            "description",
            "input_schema",
            "cache_control",
            "strict",
            "input_examples",
            "eager_input_streaming",
            "defer_loading",
        }
    )
    MESSAGES_HEADERS = frozenset({"anthropic-version"})  # all a Messages request may send on
    REFUSED_SOURCES = frozenset({"file", "url"})  # Files API ids; URLs the provider fetches
    REFUSED_BLOCKS = frozenset({"container_upload"})
    NESTED = ("extra_body", "litellm_embedding_config")
    FALLBACKS = ("fallbacks", "context_window_fallbacks", "content_policy_fallbacks")
    PARAM_REFUSED = "GATEWAY_PARAM_REFUSED"
    ROUTE_REFUSED = "GATEWAY_ROUTE_REFUSED"
    _ALIAS = re.compile(r"agentbreeder-[A-Za-z0-9-]{1,64}")
    _LABEL = re.compile(r"[a-z_]{1,40}")
    _MAX_DEPTH = 12  # LiteLLM accepts fallbacks nested up to 2 * ROUTER_MAX_FALLBACKS (10)
    _MAX_CONTENT_DEPTH = 8  # blocks inside tool_result or document content, nested


    class _TooDeep(Exception):
        """Fallbacks nested deeper than the filter reads: refused, never passed unread."""


    def _mapping(value):
        """A dict, or a JSON object sent as a string (form and `extra_body` callers do this)."""
        if isinstance(value, dict):
            return value
        if isinstance(value, str) and value[:1] == "{":
            try:
                parsed = json.loads(value)
            except (ValueError, RecursionError):
                return None
            return parsed if isinstance(parsed, dict) else None
        return None


    def _found(block):
        if not isinstance(block, dict):
            return None
        for key in block:
            if isinstance(key, str) and key in ROUTING_FIELDS:
                return key
        return None


    def _fallback_targets(value, depth=0):
        if not isinstance(value, list):
            return
        if depth > _MAX_DEPTH:
            raise _TooDeep
        for item in value:
            item = _mapping(item)
            if item is None:
                continue
            yield item
            for nested in item.values():
                yield from _fallback_targets(nested, depth + 1)


    def _blocks(data):
        """(where, block) for every place a request can carry router parameters."""
        yield "body", data
        for name in NESTED:
            nested = _mapping(data.get(name))
            if nested is not None:
                yield name, nested
        for source in (data, _mapping(data.get("router_settings_override")) or {}):
            for name in FALLBACKS:
                for target in _fallback_targets(source.get(name)):
                    yield "fallbacks", target


    def _client_tools(tools):
        """True when `tools` holds client tools only: objects with no `type`, or `custom`."""
        if not isinstance(tools, list):
            return False
        return all(
            isinstance(tool, dict)
            and tool.get("type", "custom") == "custom"
            and not set(tool) - CLIENT_TOOL_KEYS
            for tool in tools
        )


    def _api_version_only(value):
        """True when `provider_specific_header` (one entry or a list) carries `anthropic-version`
        and nothing else."""
        entries = value if isinstance(value, list) else [value]
        if not entries:
            return False
        for entry in entries:
            if not isinstance(entry, dict) or set(entry) - {"custom_llm_provider", "extra_headers"}:
                return False
            headers = entry.get("extra_headers")
            if not isinstance(headers, dict):
                return False
            for name, header in headers.items():
                if not isinstance(name, str) or name.lower() not in MESSAGES_HEADERS:
                    return False
                if not isinstance(header, str):
                    return False
        return True


    def _refused_blocks(blocks, depth=0):
        """True when a list of content blocks holds a refused block or source, or nests deeper than
        the filter reads. Only the block structure is read: a block's `content` (tool results) and
        a `content` source's blocks (documents), never a `tool_use` input or text."""
        if not isinstance(blocks, list):
            return False
        if depth > _MAX_CONTENT_DEPTH:
            return True
        for block in blocks:
            if not isinstance(block, dict):
                continue
            if block.get("type") in REFUSED_BLOCKS:
                return True
            source = block.get("source")
            if isinstance(source, dict):
                if source.get("type") in REFUSED_SOURCES:
                    return True
                if _refused_blocks(source.get("content"), depth + 1):
                    return True
            if _refused_blocks(block.get("content"), depth + 1):
                return True
        return False


    def _refused_content(field, value):
        if field == "system":
            return _refused_blocks(value)
        if not isinstance(value, list):
            return False
        return any(isinstance(m, dict) and _refused_blocks(m.get("content")) for m in value)


    def _messages_refusal(data):
        """(field, where) for the Messages-only checks, else None: in every place a request can
        carry parameters (the body, `extra_body`, fallback targets), as for the routing fields."""
        for where, block in _blocks(data):
            for key in block:
                if isinstance(key, str) and key in MESSAGES_REFUSED_FIELDS:
                    return key, where
            tools = block.get("tools")
            if tools is not None and not _client_tools(tools):
                return "tools", where
            headers = block.get("provider_specific_header")
            if headers is not None and not _api_version_only(headers):
                return "provider_specific_header", where
            for field in ("messages", "system"):
                if _refused_content(field, block.get(field)):
                    return field, where
        return None


    def refusal(data, call_type):
        """(code, field, where) when the request must be refused, else None. `data` is the request
        as LiteLLM's pre-call hook sees it: the caller's body plus what the proxy derived from
        headers and query parameters."""
        if call_type not in ALLOWED_CALL_TYPES:
            return ROUTE_REFUSED, None, "route"
        if not isinstance(data, dict):
            return PARAM_REFUSED, None, "body"
        try:
            for where, block in _blocks(data):
                field = _found(block)
                if field:
                    return PARAM_REFUSED, field, where
            if call_type in MESSAGES_CALL_TYPES:
                found = _messages_refusal(data)
                if found:
                    return PARAM_REFUSED, *found
        except _TooDeep:
            return PARAM_REFUSED, None, "fallbacks"
        return None


    def _label(value):
        return value if isinstance(value, str) and _LABEL.fullmatch(value) else "other"


    def log_line(code, field, where, call_type, alias):
        alias = alias if isinstance(alias, str) and _ALIAS.fullmatch(alias) else "other"
        return (
            f"agentbreeder gateway: refused {code} field={_label(field) if field else '-'} "
            f"in={_label(where.replace('.', '_'))} call={_label(call_type)} key_alias={alias}"
        )


    _MESSAGES_FIELDS = MESSAGES_REFUSED_FIELDS | {
        "tools",
        "provider_specific_header",
        "messages",
        "system",
    }


    def message(code, field):
        if code == ROUTE_REFUSED:
            return (
                f"{code}: the gateway serves chat completions, embeddings and Anthropic messages only"
            )
        named = f" ({field})" if field else ""
        if field in _MESSAGES_FIELDS:
            return (
                f"{code}: the gateway refuses provider-side tools, execution and storage in Messages "
                f"requests{named}"
            )
        return f"{code}: the gateway refuses provider-routing parameters in requests{named}"


    class RequestFilter(CustomLogger):
        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            found = refusal(data, call_type)
            if found is None:
                return None
            code, field, where = found
            alias = getattr(user_api_key_dict, "key_alias", None)
            print(log_line(code, field, where, call_type, alias), file=sys.stderr, flush=True)
            raise HTTPException(status_code=400, detail=message(code, field))


    handler = RequestFilter()
  start.py: "#!/app/.venv/bin/python3\n\"\"\"Start LiteLLM with its secrets read from mounted files (never from the container config).\n\nLiteLLM's config refers to keys as `os.environ/NAME`, so the files under /run/secrets are copied\ninto this process's environment (a fixed allow-list of names), then LiteLLM replaces this\nprocess. Values are never printed. A provider key that wasn't imported is simply absent.\n\n1.2.0 (#1025 \xA74.3): LiteLLM gets an allow-list of variables, not the container's environment,\nso ambient cloud credentials, metadata endpoints and proxies never reach it; the metadata and\ncredential-file variables below are forced; and the reviewed config is parsed before `exec`,\nfailing closed, so an unset gateway-only credential it names stops the start instead of falling\nthrough to a provider SDK's default credential chain.\n\n1.3.0 (#1105): LiteLLM runs a copy of the reviewed config whose only change is\n`litellm_settings.callbacks: [agentbreeder_request_filter.handler]` (files/\nagentbreeder_request_filter.py, on PYTHONPATH), which refuses provider-routing parameters and\nevery call type but chat completions and embeddings. The copy is written to a new private\ndirectory under /tmp; the reviewed config may not name callbacks itself.\n\"\"\"\n\nimport os\nimport sys\nimport tempfile\n\nSECRETS = \"/run/secrets\"\nCONFIG = \"/run/params/config\"\nNAMES = {\n    \"master-key\": \"LITELLM_MASTER_KEY\",\n    \"database-url\": \"DATABASE_URL\",\n    \"gemini-api-key\": \"GEMINI_API_KEY\",\n    \"openrouter-api-key\": \"OPENROUTER_API_KEY\",\n    \"openai-api-key\": \"OPENAI_API_KEY\",\n    \"anthropic-api-key\": \"ANTHROPIC_API_KEY\",\n}\nREQUIRED = {\"master-key\", \"database-url\"}\nLIMIT = 16384\nCONFIG_LIMIT = 262144  # the host-side review reads at most 256 KiB too\n\n# The variables this version's service.yaml sets (a test checks the two lists are equal), plus\n# AgentBreeder's own service name.\nSERVICE_ENV = (\n    \"HOME\",\n    \"LITELLM_LOG\",\n    \"PRESIDIO_ANALYZER_API_BASE\",\n    \"PRESIDIO_ANONYMIZER_API_BASE\",\n    \"LITELLM_TELEMETRY\",\n    \"DISABLE_ADMIN_UI\",\n    \"NO_DOCS\",\n    \"STORE_MODEL_IN_DB\",\n    \"AWS_EC2_METADATA_DISABLED\",\n    \"AWS_CONFIG_FILE\",\n    \"AWS_SHARED_CREDENTIALS_FILE\",\n    \"NO_GCE_CHECK\",\n    \"GCE_METADATA_HOST\",\n    \"GCE_METADATA_IP\",\n    \"GCE_METADATA_ROOT\",\n    \"PYTHONPATH\",\n    \"AGENTBREEDER_SERVICE\",\n)\n# The pinned image's own ENV names (`docker image inspect` of the service.yaml digest, recorded\n# in #1025 O1), by name: no wildcard.\nIMAGE_ENV = (\n    \"PATH\",\n    \"SSL_CERT_FILE\",\n    \"LITELLM_RELEASE_TAG\",\n    \"PRISMA_BINARY_CACHE_DIR\",\n    \"PRISMA_CLI_PATH\",\n    \"PRISMA_CLI_QUERY_ENGINE_TYPE\",\n    \"PRISMA_OFFLINE_MODE\",\n)\n# Forced whatever the container says. NO_GCE_CHECK's casing and value are what the pinned\n# google-auth (2.52.0) reads; botocore reads AWS_EC2_METADATA_DISABLED. A name that never\n# resolves sends no packet to a metadata address.\nFORCED = {\n    \"AWS_EC2_METADATA_DISABLED\": \"true\",\n    \"AWS_CONFIG_FILE\": \"/dev/null\",\n    \"AWS_SHARED_CREDENTIALS_FILE\": \"/dev/null\",\n    \"NO_GCE_CHECK\": \"true\",\n    \"GCE_METADATA_HOST\": \"metadata.invalid\",\n    \"GCE_METADATA_IP\": \"metadata.invalid\",\n    \"GCE_METADATA_ROOT\": \"metadata.invalid\",\n    \"PYTHONPATH\": \"/files\",  # the request filter, and nothing from the container\n}\n# gateway_providers.GATEWAY_ONLY (a test checks the copy): the cloud credentials only the\n# built-in gateway may import. This version imports none of them, so a config naming one stops.\nGATEWAY_ONLY = (\n    \"AZURE_OPENAI_API_KEY\",\n    \"AZURE_OPENAI_ENDPOINT\",\n    \"BEDROCK_ACCESS_KEY_ID\",\n    \"BEDROCK_SECRET_ACCESS_KEY\",\n    \"VERTEX_SERVICE_ACCOUNT_JSON\",\n)\nENV_REF = \"os.environ/\"\nLOCAL_PREFIXES = (\"ollama/\", \"ollama_chat/\")  # providers that need no key (Ollama)\nFILTER = \"agentbreeder_request_filter.handler\"  # files/agentbreeder_request_filter.py\nRUN_DIR = \"/tmp\"\n\n\ndef read(name):\n    path = os.path.join(SECRETS,\
    \ name)\n    try:\n        fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\n    except FileNotFoundError:\n        return None\n    except OSError:  # a symlink (O_NOFOLLOW) or anything else unexpected\n        sys.exit(f\"litellm launcher: secret {name} can't be read\")\n    with os.fdopen(fd, \"rb\") as handle:\n        data = handle.read(LIMIT + 1)\n    if not data or len(data) > LIMIT or b\"\\0\" in data or b\"\\n\" in data.rstrip(b\"\\n\"):\n        sys.exit(f\"litellm launcher: secret {name} is empty or malformed\")\n    try:\n        return data.rstrip(b\"\\n\").decode(\"utf-8\", \"strict\")\n    except UnicodeDecodeError:  # never the traceback: it would quote the bytes\n        sys.exit(f\"litellm launcher: secret {name} is not UTF-8\")\n\n\ndef strings(value):\n    \"\"\"Every string in a parsed YAML document, keys included, recursively.\"\"\"\n    if isinstance(value, str):\n        yield value\n    elif isinstance(value, dict):\n        for key, item in value.items():\n            yield from strings(key)\n            yield from strings(item)\n    elif isinstance(value, list):\n        for item in value:\n            yield from strings(item)\n\n\ndef load_config(path=CONFIG):\n    \"\"\"The reviewed config, parsed, and the variables it names; any failure stops the start\n    (fail closed), without a traceback that could quote it.\"\"\"\n    try:\n        import yaml\n\n        with open(path, \"rb\") as handle:\n            raw = handle.read(CONFIG_LIMIT + 1)\n        if len(raw) > CONFIG_LIMIT:\n            raise ValueError(\"too large\")\n        document = yaml.safe_load(raw.decode(\"utf-8\", \"strict\"))\n        if not isinstance(document, dict):\n            raise ValueError(\"not a mapping\")\n        names = referenced(document)\n    except (Exception, RecursionError, MemoryError):  # noqa: BLE001 - fail closed, print no value\n        sys.exit(\"litellm launcher: the gateway config can't be read or parsed\")\n    return document, names\n\n\ndef referenced(document):\n    \"\"\"The variable names the config reads through `os.environ/NAME`.\"\"\"\n    return {text[len(ENV_REF) :] for text in strings(document) if text.startswith(ENV_REF)}\n\n\ndef local_models(document):\n    \"\"\"Whether a model_list entry routes to a provider that needs no key (Ollama).\"\"\"\n    for entry in document.get(\"model_list\") or []:\n        params = entry.get(\"litellm_params\") if isinstance(entry, dict) else None\n        model = params.get(\"model\") if isinstance(params, dict) else None\n        if isinstance(model, str) and model.startswith(LOCAL_PREFIXES):\n            return True\n    return False\n\n\ndef with_filter(document):\n    \"\"\"The reviewed config with the request filter as LiteLLM's only callback. A config that\n    names callbacks itself stops the start (the host-side review refuses it too).\"\"\"\n    settings = document.get(\"litellm_settings\")\n    if settings is None:\n        settings = {}\n    if not isinstance(settings, dict) or \"callbacks\" in settings:\n        sys.exit(\"litellm launcher: the gateway config may not set litellm_settings.callbacks\")\n    return {**document, \"litellm_settings\": {**settings, \"callbacks\": [FILTER]}}\n\n\ndef write_config(document, run_dir=RUN_DIR):\n    \"\"\"Write the filtered config to a new private directory; returns its path.\"\"\"\n    try:\n        import yaml\n\n        directory = tempfile.mkdtemp(prefix=\"agentbreeder-litellm-\", dir=run_dir)\n        path = os.path.join(directory, \"config.yaml\")\n        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\n        with os.fdopen(fd, \"w\", encoding=\"utf-8\") as handle:\n            yaml.safe_dump(document, handle, sort_keys=False)\n    except Exception:  # noqa: BLE001 - fail closed, print no value\n        sys.exit(\"litellm launcher: the filtered gateway config can't be written\")\n    return path\n\n\ndef environment_for(source, secrets):\n    \"\"\"LiteLLM's environment: the allow-listed names from `source`, the forced variables, and\n    the secrets read from\
    \ files.\"\"\"\n    environment = {name: source[name] for name in SERVICE_ENV + IMAGE_ENV if name in source}\n    environment.update(FORCED)\n    environment.update(secrets)\n    return environment\n\n\ndef main():\n    secrets = {}\n    for name, variable in NAMES.items():\n        value = read(name)\n        if value is None:\n            if name in REQUIRED:\n                sys.exit(f\"litellm launcher: secret {name} is missing\")\n            continue\n        secrets[variable] = value\n    environment = environment_for(os.environ, secrets)\n    document, names = load_config()\n    missing = sorted(n for n in names if n in GATEWAY_ONLY and n not in environment)\n    if missing:\n        sys.exit(\n            \"litellm launcher: the config needs \"\n            + \", \".join(missing)\n            + \", which this gateway did not import\"\n        )\n    providers = [variable for name, variable in NAMES.items() if name not in REQUIRED]\n    if not any(variable in environment for variable in providers) and not local_models(document):\n        print(\"litellm launcher: no provider key imported; model calls will fail\", file=sys.stderr)\n    config = write_config(with_filter(document))\n    argv = [\"litellm\", \"--config\", config, \"--port\", \"4000\"]\n    os.execve(\"/app/.venv/bin/litellm\", argv, environment)\n\n\nif __name__ == \"__main__\":\n    main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-svc-litellm-params
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: builtins
    io.agentbreeder/service: litellm
data:
  config: |
    model_list:
    - litellm_params:
        api_key: os.environ/GEMINI_API_KEY
        model: gemini/gemini-x
      model_name: m1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: builtins
    io.agentbreeder/service: litellm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      io.agentbreeder/chart-service: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agentbreeder-services
        app.kubernetes.io/managed-by: agentbreeder
        io.agentbreeder/stack: builtins
        io.agentbreeder/service: litellm
        io.agentbreeder/chart-service: litellm
      annotations:
        io.agentbreeder/config-sha256: '9cb5a063555700e3387b2d53f479f734274822f01c041fc9403dbac83b43f5a5'
    spec:
      serviceAccountName: ab-svc-litellm
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm-database@sha256:35f2cec3a14bb297e08bfab56c1fc377432bc4071aaf71978fdff043a5d91e79
        command:
        - /files/start.py
        env:
        - name: AGENTBREEDER_SERVICE
          value: litellm
        - name: AWS_CONFIG_FILE
          value: /dev/null
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /dev/null
        - name: DISABLE_ADMIN_UI
          value: 'True'
        - name: GCE_METADATA_HOST
          value: metadata.invalid
        - name: GCE_METADATA_IP
          value: metadata.invalid
        - name: GCE_METADATA_ROOT
          value: metadata.invalid
        - name: HOME
          value: /tmp
        - name: LITELLM_LOG
          value: WARNING
        - name: LITELLM_TELEMETRY
          value: 'False'
        - name: NO_DOCS
          value: 'True'
        - name: NO_GCE_CHECK
          value: 'true'
        - name: PRESIDIO_ANALYZER_API_BASE
          value: http://analyzer:3000
        - name: PRESIDIO_ANONYMIZER_API_BASE
          value: http://anonymizer:3000
        - name: PYTHONPATH
          value: /files
        - name: STORE_MODEL_IN_DB
          value: 'False'
        resources:
          requests:
            cpu: '100m'
            memory: '256Mi'
          limits:
            cpu: '2'
            memory: '2Gi'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: files
          mountPath: /files
          readOnly: true
        - name: params
          mountPath: /run/params
          readOnly: true
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        ports:
        - name: http
          containerPort: 4000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
            httpHeaders:
            - name: Host
              value: litellm:4000
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: '64Mi'
      - name: files
        configMap:
          name: ab-svc-litellm-files
          items:
          - key: agentbreeder_request_filter.py
            path: agentbreeder_request_filter.py
            mode: 292
          - key: start.py
            path: start.py
            mode: 365
      - name: params
        configMap:
          name: ab-svc-litellm-params
          defaultMode: 292
      - name: secrets
        projected:
          defaultMode: 292
          sources:
          - secret:
              name: ab-svc-litellm-anthropic-api-key-018b49-g1
              items:
              - key: value
                path: anthropic-api-key
              optional: true
          - secret:
              name: ab-svc-postgres-databases-litellm-86f17f-g1
              items:
              - key: value
                path: database-url
              optional: false
          - secret:
              name: ab-svc-litellm-gemini-api-key-f2386d-g1
              items:
              - key: value
                path: gemini-api-key
              optional: true
          - secret:
              name: ab-svc-litellm-master-key-ad8fc9-g1
              items:
              - key: value
                path: master-key
              optional: false
          - secret:
              name: ab-svc-litellm-openai-api-key-4a87fd-g1
              items:
              - key: value
                path: openai-api-key
              optional: true
          - secret:
              name: ab-svc-litellm-openrouter-api-key-e8334a-g1
              items:
              - key: value
                path: openrouter-api-key
              optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: builtins
    io.agentbreeder/service: litellm
spec:
  type: ClusterIP
  selector:
    io.agentbreeder/chart-service: litellm
  ports:
  - name: http
    port: 4000
    targetPort: 4000
    protocol: TCP
{{- end }}
