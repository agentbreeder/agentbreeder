apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: builtins
    io.agentbreeder/service: phoenix
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      io.agentbreeder/chart-service: phoenix
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agentbreeder-services
        app.kubernetes.io/managed-by: agentbreeder
        io.agentbreeder/stack: builtins
        io.agentbreeder/service: phoenix
        io.agentbreeder/chart-service: phoenix
      annotations:
        io.agentbreeder/config-sha256: db0a94888d8f15a18f8d7118aa3598092ee42d45480aa77904cde10e0949dad5
    spec:
      serviceAccountName: ab-svc-phoenix
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: phoenix
        image: arizephoenix/phoenix@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
        command:
        - /files/start.py
        env:
        - name: AGENTBREEDER_SERVICE
          value: phoenix
        - name: HOME
          value: /tmp
        - name: PHOENIX_AGENTS_DISABLE_BASH
          value: 'true'
        - name: PHOENIX_AGENTS_DISABLE_GITHUB
          value: 'true'
        - name: PHOENIX_AGENTS_DISABLE_WEB_ACCESS
          value: 'true'
        - name: PHOENIX_ALLOWED_SANDBOX_PROVIDERS
          value: NONE
        - name: PHOENIX_DISABLE_AGENT_ASSISTANT
          value: 'true'
        - name: PHOENIX_DISABLE_MODEL_COST_AUTO_UPDATE
          value: 'true'
        - name: PHOENIX_ENABLE_AUTH
          value: 'true'
        - name: PHOENIX_TELEMETRY_ENABLED
          value: 'false'
        - name: PHOENIX_WORKING_DIR
          value: /tmp/phoenix
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        resources:
          requests:
            cpu: '100m'
            memory: '256Mi'
          limits:
            cpu: '2'
            memory: '2Gi'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: files
          mountPath: /files
          readOnly: true
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        ports:
        - name: http
          containerPort: 6006
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 6006
            httpHeaders:
            - name: Host
              value: phoenix:6006
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: '64Mi'
      - name: files
        configMap:
          name: ab-svc-phoenix-files
          items:
          - key: bootstrap.py
            path: bootstrap.py
            mode: 365
          - key: start.py
            path: start.py
            mode: 365
      - name: secrets
        projected:
          defaultMode: 292
          sources:
          - secret:
              name: ab-svc-phoenix-admin-password-371e79-g1
              items:
              - key: value
                path: admin-password
              optional: false
          - secret:
              name: ab-svc-phoenix-admin-secret-2812d0-g1
              items:
              - key: value
                path: admin-secret
              optional: false
          - secret:
              name: ab-svc-postgres-databases-phoenix-4f8277-g1
              items:
              - key: value
                path: database-url
              optional: false
          - secret:
              name: ab-svc-phoenix-ingest-key-d69af0-g1
              items:
              - key: value
                path: ingest-key
              optional: true
          - secret:
              name: ab-svc-phoenix-read-key-382fd1-g1
              items:
              - key: value
                path: read-key
              optional: true
          - secret:
              name: ab-svc-phoenix-secret-ef0f70-g1
              items:
              - key: value
                path: secret
              optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: builtins
    io.agentbreeder/service: phoenix
spec:
  type: ClusterIP
  selector:
    io.agentbreeder/chart-service: phoenix
  ports:
  - name: http
    port: 6006
    targetPort: 6006
    protocol: TCP
{{- end }}
