data:
  bootstrap.py: |
    #!/usr/bin/python3.13
    """Mint the trace-ingest key: a Phoenix system API key, printed to stdout (and nothing else).

    Runs once Phoenix is healthy, on the stack network, as a one-shot with the admin secret mounted.
    AgentBreeder stores what this prints as the `ingest-key` secret. Errors never include the
    response body or any secret.
    """

    import json
    import os
    import re
    import sys
    import time
    import urllib.error
    import urllib.request

    HOST = os.environ.get("AGENTBREEDER_SERVICE", "")
    SECRET = "/run/secrets/admin-secret"
    JWT = re.compile(r"[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+")
    QUERY = 'mutation { createSystemApiKey(input: {name: "agentbreeder-ingest"}) { jwt } }'


    def fail(message):
        sys.exit(f"phoenix bootstrap: {message}")


    def admin_secret():
        try:
            fd = os.open(SECRET, os.O_RDONLY | os.O_NOFOLLOW)
        except OSError:
            fail("the admin secret can't be read")
        with os.fdopen(fd, "rb") as handle:
            value = handle.read(4097).strip()
        if not value or len(value) > 4096 or not value.isascii() or b"\n" in value:
            fail("the admin secret is empty or malformed")
        return value.decode()


    def mint(secret):
        if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,62}", HOST):
            fail("AGENTBREEDER_SERVICE is not a service name")
        request = urllib.request.Request(
            f"http://{HOST}:6006/graphql",
            data=json.dumps({"query": QUERY}).encode(),
            headers={"authorization": f"Bearer {secret}", "content-type": "application/json"},
            method="POST",
        )
        for attempt in range(10):
            try:
                with urllib.request.urlopen(request, timeout=10) as response:
                    body = response.read(65536)
                break
            except urllib.error.HTTPError as error:
                if error.code < 500:
                    fail(f"Phoenix refused the request (HTTP {error.code})")
            except OSError:
                pass
            time.sleep(1 + attempt)
        else:
            fail("Phoenix did not answer")
        try:
            jwt = json.loads(body)["data"]["createSystemApiKey"]["jwt"]
        except (ValueError, KeyError, TypeError):
            fail("Phoenix's answer had no system key")
        if not isinstance(jwt, str) or len(jwt) > 4096 or not JWT.fullmatch(jwt):
            fail("Phoenix's system key is not a JWT")
        return jwt


    def main():
        sys.stdout.write(mint(admin_secret()) + "\n")


    if __name__ == "__main__":
        main()
  start.py: |
    #!/usr/bin/python3.13
    """Start Phoenix with its secrets read from mounted files (never from the container config).

    Phoenix reads its signing secrets, initial admin password and database URL only from environment
    variables, so the files under /run/secrets are copied into this process's environment (a fixed
    allow-list), then Phoenix replaces this process. Values are never printed.
    """

    import os
    import sys

    SECRETS = "/run/secrets"
    NAMES = {
        "secret": "PHOENIX_SECRET",
        "admin-secret": "PHOENIX_ADMIN_SECRET",
        "admin-password": "PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD",
        "database-url": "PHOENIX_SQL_DATABASE_URL",
    }
    LIMIT = 16384


    def read(name):
        path = os.path.join(SECRETS, name)
        try:
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
        except FileNotFoundError:
            sys.exit(f"phoenix launcher: secret {name} is missing")
        except OSError:  # a symlink (O_NOFOLLOW) or anything else unexpected
            sys.exit(f"phoenix launcher: secret {name} can't be read")
        with os.fdopen(fd, "rb") as handle:
            data = handle.read(LIMIT + 1)
        if not data or len(data) > LIMIT or b"\0" in data or b"\n" in data.rstrip(b"\n"):
            sys.exit(f"phoenix launcher: secret {name} is empty or malformed")
        return data.rstrip(b"\n").decode("utf-8", "strict")


    def main():
        environment = dict(os.environ)
        for name, variable in NAMES.items():
            environment[variable] = read(name)
        # Only the URL above selects the database: never a PHOENIX_POSTGRES_* fallback.
        for variable in [v for v in environment if v.startswith("PHOENIX_POSTGRES_")]:
            del environment[variable]
        argv = [sys.executable, "-m", "phoenix.server.main", "serve"]
        os.execve(argv[0], argv, environment)


    if __name__ == "__main__":
        main()
