---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ab-svc-litellm
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: northwind
