apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-svc-litellm-files
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: northwind
    io.agentbreeder/service: litellm
data:
  start.py: |
    #!/app/.venv/bin/python3
    """Start LiteLLM with its secrets read from mounted files (never from the container config).

    LiteLLM's config refers to keys as `os.environ/NAME`, so the files under /run/secrets are copied
    into this process's environment (a fixed allow-list of names), then LiteLLM replaces this
    process. Values are never printed. A provider key that wasn't imported is simply absent.
    """

    import os
    import sys

    SECRETS = "/run/secrets"
    NAMES = {
        "master-key": "LITELLM_MASTER_KEY",
        "database-url": "DATABASE_URL",
        "gemini-api-key": "GEMINI_API_KEY",
        "openrouter-api-key": "OPENROUTER_API_KEY",
        "openai-api-key": "OPENAI_API_KEY",
        "anthropic-api-key": "ANTHROPIC_API_KEY",
    }
    REQUIRED = {"master-key", "database-url"}
    LIMIT = 16384


    def read(name):
        path = os.path.join(SECRETS, name)
        try:
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
        except FileNotFoundError:
            return None
        except OSError:  # a symlink (O_NOFOLLOW) or anything else unexpected
            sys.exit(f"litellm launcher: secret {name} can't be read")
        with os.fdopen(fd, "rb") as handle:
            data = handle.read(LIMIT + 1)
        if not data or len(data) > LIMIT or b"\0" in data or b"\n" in data.rstrip(b"\n"):
            sys.exit(f"litellm launcher: secret {name} is empty or malformed")
        return data.rstrip(b"\n").decode("utf-8", "strict")


    def main():
        environment = dict(os.environ)
        for name, variable in NAMES.items():
            value = read(name)
            if value is None:
                if name in REQUIRED:
                    sys.exit(f"litellm launcher: secret {name} is missing")
                environment.pop(variable, None)
                continue
            environment[variable] = value
        providers = [variable for name, variable in NAMES.items() if name not in REQUIRED]
        if not any(variable in environment for variable in providers):
            print("litellm launcher: no provider key imported; model calls will fail", file=sys.stderr)
        argv = ["litellm", "--config", "/run/params/config", "--port", "4000"]
        os.execvpe(argv[0], argv, environment)


    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-svc-litellm-params
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: northwind
    io.agentbreeder/service: litellm
data:
  config: |
    # LiteLLM Proxy (model gateway) for the Northwind support agent.
    # The agent asks for model aliases; this file decides which provider serves them.
    # Provider keys come from Compose secrets (see litellm/entrypoint.sh) and never reach the agent,
    # which holds only a scoped, budget-capped LiteLLM virtual key minted by up.sh.
    model_list:
      # Chat: Gemini direct first ...
      - model_name: support-model
        litellm_params:
          model: gemini/gemini-3.8-flash   # 3.5-flash-lite failed the gate (50/61, 2026-11-07)
          api_key: os.environ/GEMINI_API_KEY
          timeout: 60
      # ... OpenRouter (same model, different route) when Gemini fails or rate-limits.
      - model_name: support-model-openrouter
        litellm_params:
          model: openrouter/google/gemini-3.8-flash
          api_key: os.environ/OPENROUTER_API_KEY
          timeout: 60
      # Eval judge (offline evals in `agentbreeder release`); stronger model, separate key.
      - model_name: support-judge
        litellm_params:
          model: gemini/gemini-3.8-flash   # judge: a flash model keeps eval runs cheap
          api_key: os.environ/GEMINI_API_KEY
          timeout: 120
      # Knowledge-base embeddings (768-dim, matches the kb_chunks pgvector column).
      - model_name: support-embedding
        litellm_params:
          model: gemini/gemini-embedding-2
          api_key: os.environ/GEMINI_API_KEY
          dimensions: 768

    router_settings:
      num_retries: 1
      retry_after: 1
      # Cool a failing deployment down instead of hammering it.
      allowed_fails: 3
      cooldown_time: 30

    litellm_settings:
      fallbacks: [{"support-model": ["support-model-openrouter"]}]
      drop_params: true          # don't fail a fallback on a parameter OpenRouter lacks
      request_timeout: 120
      turn_off_message_logging: true   # spend logs keep tokens/cost, not customer messages

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_prompts_in_spend_logs: false
      disable_spend_logs: false
