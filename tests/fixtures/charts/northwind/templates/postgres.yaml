# Generated by `agentbreeder services render --cluster`; do not edit.
# Service postgres, tier 0.
{{- if .Values.tiers.tier0 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ab-svc-postgres
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: northwind
    io.agentbreeder/service: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-svc-postgres-files
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: northwind
    io.agentbreeder/service: postgres
data:
  init.sh: |
    #!/bin/sh
    # Runs on every `services up` after health (idempotent). One login role per database, named after
    # it: the role owns its database, PUBLIC loses CONNECT, so a role can't reach another database.
    # Extra `roles` get least privilege in `roles_database`, and `console_database` gets the console
    # role (see below). The superuser stays inside this step. Role passwords are generated hex tokens.
    set -eu
    export PGHOST="$AGENTBREEDER_SERVICE" PGPORT=5432 PGUSER=postgres PGDATABASE=postgres
    PGPASSWORD="$(cat /run/secrets/superuser)"
    export PGPASSWORD

    # Reserved: the console role (below). No `databases` or `roles` item may use it.
    CONSOLE_ROLE=agentbreeder_console

    check_name() {
      case "$1" in
        "" | *[!a-z0-9_]* | [!a-z]* | pg_* | postgres | "$CONSOLE_ROLE")
          echo "invalid $2 name" >&2; exit 3 ;;
      esac
    }

    check_password() {
      case "$1" in
        "" | *[!0-9a-f]*) echo "invalid generated password" >&2; exit 3 ;;
      esac
    }

    # Role attributes for every login role this step manages. The password goes in on stdin
    # (validated hex), never in argv where `ps` shows it.
    login_role() {
      psql -v ON_ERROR_STOP=1 -qAt -v name="$1" <<SQL
    \\set pw '$2'
    SELECT format('CREATE ROLE %I LOGIN', :'name')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'name') \\gexec
    SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION '
                  'NOBYPASSRLS PASSWORD %L', :'name', :'pw') \\gexec
    SQL
    }

    # The maintenance databases are not for applications.
    psql -v ON_ERROR_STOP=1 -qAt -c 'REVOKE CONNECT ON DATABASE postgres FROM PUBLIC' \
      -c 'REVOKE CONNECT ON DATABASE template1 FROM PUBLIC'

    # A database named like the console role fails closed (it can't come from `databases`).
    # Assigned first, so `set -e` stops on a psql error instead of passing an empty result.
    reserved_db="$(psql -v ON_ERROR_STOP=1 -qAt -v name="$CONSOLE_ROLE" <<SQL
    SELECT 1 FROM pg_database WHERE datname = :'name'
    SQL
    )"
    if [ -n "$reserved_db" ]; then
      echo "a database named $CONSOLE_ROLE exists; it is reserved" >&2; exit 3
    fi

    for file in /run/secrets/role/*; do
      [ -e "$file" ] || continue
      db="${file#/run/secrets/role/}"
      check_name "$db" database
      password="$(cat "$file")"
      check_password "$password"
      login_role "$db" "$password"
      psql -v ON_ERROR_STOP=1 -qAt -v db="$db" <<SQL
    SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'db')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db') \\gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'db') \\gexec
    SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db') \\gexec
    SQL
      psql -v ON_ERROR_STOP=1 -qAt -d "$db" -c 'CREATE EXTENSION IF NOT EXISTS vector'
    done

    # The console role (`console_database`): AgentBreeder's own CLI commands read and write the
    # tables the database owner made with it, after that owner's init_sql grants them (so it is made
    # before init_sql runs). It can connect to that one database and holds nothing else: no schema,
    # no membership in or of any role, no CREATE or TEMP (PUBLIC has no rights on declared
    # databases). A role of that name that owns anything or has a membership was not made here:
    # fail closed. Every run revokes its own CONNECT on every other database (a database made
    # outside the stack that still lets PUBLIC connect stays reachable, as for every role); unset,
    # the role can't log in and its sessions end, so a removed console credential stops working.
    console_exists="$(psql -v ON_ERROR_STOP=1 -qAt -v name="$CONSOLE_ROLE" <<SQL
    SELECT 1 FROM pg_roles WHERE rolname = :'name'
    SQL
    )"
    if [ -n "$console_exists" ]; then
      foreign="$(psql -v ON_ERROR_STOP=1 -qAt -v name="$CONSOLE_ROLE" <<SQL
    SELECT 1 FROM pg_roles r WHERE r.rolname = :'name' AND (
      EXISTS (SELECT 1 FROM pg_shdepend d WHERE d.refclassid = 'pg_authid'::regclass
              AND d.refobjid = r.oid AND d.deptype = 'o')
      OR EXISTS (SELECT 1 FROM pg_auth_members m WHERE m.member = r.oid OR m.roleid = r.oid))
    SQL
    )"
      [ -z "$foreign" ] || { echo "role $CONSOLE_ROLE owns objects or has memberships" >&2; exit 3; }
    fi
    console_db="${CONSOLE_DATABASE:-}"
    if [ -n "$console_db" ]; then
      check_name "$console_db" console_database
      if [ ! -f "/run/secrets/role/$console_db" ]; then
        echo "console_database must be a declared database" >&2; exit 3
      fi
      password="$(cat /run/secrets/console)"
      check_password "$password"
      login_role "$CONSOLE_ROLE" "$password"
      psql -v ON_ERROR_STOP=1 -qAt -v role="$CONSOLE_ROLE" -v db="$console_db" <<SQL
    SELECT format('ALTER ROLE %I CONNECTION LIMIT 10 VALID UNTIL %L', :'role', 'infinity') \\gexec
    SELECT format('ALTER ROLE %I RESET ALL', :'role') \\gexec
    SELECT format('REVOKE ALL ON DATABASE %I FROM %I', datname, :'role') FROM pg_database
      WHERE datname <> :'db' \\gexec
    SELECT format('REVOKE ALL ON DATABASE %I FROM %I', :'db', :'role') \\gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'role') \\gexec
    SQL
    elif [ -n "$console_exists" ]; then
      psql -v ON_ERROR_STOP=1 -qAt -v role="$CONSOLE_ROLE" >/dev/null <<SQL
    SELECT format('ALTER ROLE %I NOLOGIN CONNECTION LIMIT 0', :'role') \\gexec
    SELECT format('REVOKE ALL ON DATABASE %I FROM %I', datname, :'role') FROM pg_database \\gexec
    SELECT count(pg_terminate_backend(pid)) FROM pg_stat_activity WHERE usename = :'role';
    SQL
    fi

    # Extra roles: each can connect only to roles_database, where it owns a schema named after it
    # (first on its default search_path, so its unqualified CREATEs land there, never in `public`,
    # which PostgreSQL 16 closes to CREATE). It gets no rights on the owner's tables and can't create
    # schemas. The database's owner role becomes a member of it, so the owner's init_sql can grant
    # to it and create objects for it.
    for file in /run/secrets/login/*; do
      [ -e "$file" ] || continue
      role="${file#/run/secrets/login/}"
      check_name "$role" role
      db="${ROLES_DATABASE:-}"
      if [ -z "$db" ] || [ ! -f "/run/secrets/role/$db" ]; then
        echo "roles_database must be a declared database" >&2; exit 3
      fi
      if [ -e "/run/secrets/role/$role" ]; then
        echo "a role can't share a name with a database" >&2; exit 3
      fi
      password="$(cat "$file")"
      check_password "$password"
      login_role "$role" "$password"
      psql -v ON_ERROR_STOP=1 -qAt -v role="$role" -v db="$db" <<SQL
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'role') \\gexec
    SELECT format('GRANT %I TO %I', :'role', :'db') \\gexec
    SQL
      psql -v ON_ERROR_STOP=1 -qAt -d "$db" -v role="$role" <<SQL
    SELECT format('CREATE SCHEMA IF NOT EXISTS %I AUTHORIZATION %I', :'role', :'role') \\gexec
    SQL
    done

    # init_sql comes from the repo. It is sent with `psql -c`, which hands the whole string to the
    # server: psql runs no backslash meta-commands (`\!`, `\c`, `\copy`) unless the string starts
    # with one, which is refused here. It runs as the database's own role (no superuser, no file or
    # program access) in one implicit transaction. 64 KiB cap (one argv string is at most 128 KiB).
    if [ -f /run/params/init_sql ]; then
      db="${INIT_SQL_DATABASE:-}"
      if [ -z "$db" ] || [ ! -f "/run/secrets/role/$db" ]; then
        echo "init_sql_database must be a declared database" >&2; exit 3
      fi
      [ "$(wc -c < /run/params/init_sql)" -le 65536 ] || { echo "init_sql is over 64 KiB" >&2; exit 3; }
      sql="$(cat /run/params/init_sql)"
      first="$(printf '%s' "$sql" | tr -d ' \t\r\n' | cut -c1)"
      [ "$first" != "\\" ] || { echo "init_sql must not start with a psql meta-command" >&2; exit 3; }
      PGUSER="$db" PGDATABASE="$db" PGPASSWORD="$(cat "/run/secrets/role/$db")" \
        psql -v ON_ERROR_STOP=1 -qAt -c "$sql"
    fi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-svc-postgres-params
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: northwind
    io.agentbreeder/service: postgres
data:
  init_sql: "-- Commerce data for the Northwind support agent: customers, product catalog, orders.\n-- Applied by postgres's init step on every `services up`, as the `support` role that owns the\n-- database; idempotent (seed rows use ON CONFLICT DO NOTHING, so edits you make in the database\n-- are kept). The end of the file creates the agent runtime's tables and grants the two\n-- least-privilege roles (`support_agent`, `support_ops`) and AgentBreeder's console role\n-- (`agentbreeder_console`) only what they use.\n-- Money is stored in integer cents (USD). Prices match the help-center articles in agent/kb/.\n\nCREATE TABLE IF NOT EXISTS customers (\n  id TEXT PRIMARY KEY,                 -- the customer_id the chat sends\n  name TEXT NOT NULL,\n  email TEXT NOT NULL,\n  plan TEXT NOT NULL CHECK (plan IN ('free', 'pro_monthly', 'pro_annual', 'team')),\n  seats INTEGER NOT NULL DEFAULT 1 CHECK (seats > 0),\n  country TEXT NOT NULL,\n  created TIMESTAMPTZ NOT NULL DEFAULT now());\n\nCREATE TABLE IF NOT EXISTS products (\n  sku TEXT PRIMARY KEY,\n  name TEXT NOT NULL,\n  category TEXT NOT NULL CHECK (category IN ('hardware', 'accessory', 'shipping', 'subscription')),\n  description TEXT NOT NULL,\n  price_cents INTEGER NOT NULL CHECK (price_cents >= 0),\n  unit TEXT NOT NULL DEFAULT 'each',   -- 'each', 'per user per month', 'per user per year'\n  active BOOLEAN NOT NULL DEFAULT true);\n\nCREATE TABLE IF NOT EXISTS orders (\n  id TEXT PRIMARY KEY,\n  customer_id TEXT NOT NULL REFERENCES customers(id),\n  status TEXT NOT NULL CHECK (status IN\n    ('pending', 'paid', 'shipped', 'delivered', 'cancelled', 'returned', 'refunded')),\n  ship_to_country TEXT,\n  carrier TEXT,\n  tracking_number TEXT,\n  created TIMESTAMPTZ NOT NULL DEFAULT now(),\n  shipped_at TIMESTAMPTZ,\n  delivered_at TIMESTAMPTZ,\n  total_cents INTEGER NOT NULL CHECK (total_cents >= 0));\nCREATE INDEX IF NOT EXISTS orders_customer ON orders (customer_id, created DESC);\n\nCREATE TABLE IF NOT EXISTS order_items (\n  order_id TEXT NOT NULL REFERENCES orders(id),\n  sku TEXT NOT NULL REFERENCES products(sku),\n  quantity INTEGER NOT NULL CHECK (quantity > 0),\n  unit_price_cents INTEGER NOT NULL CHECK (unit_price_cents >= 0),\n  PRIMARY KEY (order_id, sku));\n\n-- Cancellation requests filed by the agent; only a human approval (ops dashboard) cancels.\nCREATE TABLE IF NOT EXISTS cancellation_requests (\n  id TEXT PRIMARY KEY,                       -- CR-XXXXXXXX\n  order_id TEXT NOT NULL REFERENCES orders(id),\n  customer_id TEXT NOT NULL REFERENCES customers(id),\n  reason TEXT NOT NULL,\n  status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending', 'approved', 'rejected')),\n  requested_at TIMESTAMPTZ NOT NULL DEFAULT now(),\n  session TEXT, turn_id TEXT,                -- the conversation that filed it\n  decided_at TIMESTAMPTZ, decided_by TEXT, decision_note TEXT);\n-- at most one open request per order\nCREATE UNIQUE INDEX IF NOT EXISTS cancellation_one_pending\n  ON cancellation_requests (order_id) WHERE status = 'pending';\n\n-- ---------------------------------------------------------------- seed: catalog\nINSERT INTO products (sku, name, category, description, price_cents, unit) VALUES\n  ('PEN-001', 'Northwind Pen', 'hardware',\n   'Smart stylus that captures handwriting into notes. One-year warranty.', 7900, 'each'),\n  ('PEN-TIPS-3', 'Replacement pen tips (3-pack)', 'accessory',\n   'Three soft replacement tips for the Northwind Pen.', 1200, 'each'),\n  ('PEN-SLEEVE', 'Felt pen sleeve', 'accessory',\n   'Protective felt sleeve that fits the Northwind Pen.', 1900, 'each'),\n  ('PEN-DOCK', 'USB-C charging dock', 'accessory',\n   'Magnetic USB-C dock for charging the Northwind Pen.', 2900, 'each'),\n  ('SHIP-EXPRESS-US', 'Express shipping (US only, 2 business days)', 'shipping',\n   'Optional express delivery for US addresses. Standard shipping is free.', 1500, 'each'),\n  ('PLAN-PRO-MONTHLY', 'Pro plan, billed monthly', 'subscription',\n   'Unlimited notebooks, 100 GB storage.', 1000, 'per user per month'),\n  ('PLAN-PRO-ANNUAL', 'Pro plan, billed\
    \ annually', 'subscription',\n   'Unlimited notebooks, 100 GB storage ($8 per user per month).', 9600, 'per user per year'),\n  ('PLAN-TEAM', 'Team plan', 'subscription',\n   'Pro features plus shared workspaces, admin console and SSO.', 1500, 'per user per month')\nON CONFLICT (sku) DO NOTHING;\n\n-- ---------------------------------------------------------------- seed: customers\nINSERT INTO customers (id, name, email, plan, seats, country) VALUES\n  ('cust-001', 'Ava Patel', 'ava.patel@example.com', 'pro_annual', 1, 'US'),\n  ('cust-002', 'Brightline Studio', 'billing@brightline.example.com', 'team', 25, 'US'),\n  ('cust-003', 'Liam Chen', 'liam.chen@example.com', 'free', 1, 'CA'),\n  ('cust-010', 'Sofia Rossi', 'sofia.rossi@example.com', 'pro_monthly', 1, 'GB'),\n  ('cust-020', 'Noah M\xFCller', 'noah.mueller@example.com', 'pro_monthly', 1, 'DE'),\n  -- fixed customers used by the offline eval set (ops/golden.jsonl)\n  ('eval-cust-a', 'Eval Customer A', 'eval-a@example.com', 'pro_annual', 1, 'US'),\n  ('eval-cust-b', 'Eval Customer B', 'eval-b@example.com', 'team', 5, 'GB')\nON CONFLICT (id) DO NOTHING;\n\n-- ---------------------------------------------------------------- seed: orders\nINSERT INTO orders (id, customer_id, status, ship_to_country, carrier, tracking_number,\n                    created, shipped_at, delivered_at, total_cents) VALUES\n  ('NW-10021', 'cust-001', 'shipped', 'US', 'UPS', '1Z999AA10123456784',\n   now() - interval '4 days', now() - interval '2 days', NULL, 9100),\n  ('NW-10022', 'cust-001', 'delivered', 'US', 'USPS', '9400111899223197428490',\n   now() - interval '40 days', now() - interval '38 days', now() - interval '35 days', 1900),\n  ('NW-10030', 'cust-003', 'paid', 'CA', NULL, NULL,\n   now() - interval '1 day', NULL, NULL, 7900),\n  ('NW-10031', 'cust-002', 'delivered', 'US', 'FedEx', '771234567890',\n   now() - interval '20 days', now() - interval '19 days', now() - interval '16 days', 39500),\n  ('NW-10040', 'cust-010', 'cancelled', 'GB', NULL, NULL,\n   now() - interval '9 days', NULL, NULL, 7900),\n  ('NW-10041', 'cust-020', 'refunded', 'DE', 'DHL', 'JJD000390007788991',\n   now() - interval '60 days', now() - interval '58 days', now() - interval '55 days', 7900),\n  ('NW-90001', 'eval-cust-a', 'shipped', 'US', 'UPS', '1Z999AA10999000111',\n   now() - interval '3 days', now() - interval '1 day', NULL, 10600),\n  ('NW-90002', 'eval-cust-a', 'paid', 'US', NULL, NULL,\n   now() - interval '6 hours', NULL, NULL, 1200),\n  ('NW-90003', 'eval-cust-b', 'delivered', 'GB', 'Royal Mail', 'RM123456785GB',\n   now() - interval '25 days', now() - interval '24 days', now() - interval '20 days', 15800),\n  ('NW-90004', 'eval-cust-a', 'paid', 'US', NULL, NULL,\n   now() - interval '2 hours', NULL, NULL, 2900)\nON CONFLICT (id) DO NOTHING;\n\nINSERT INTO order_items (order_id, sku, quantity, unit_price_cents) VALUES\n  ('NW-10021', 'PEN-001', 1, 7900), ('NW-10021', 'PEN-TIPS-3', 1, 1200),\n  ('NW-10022', 'PEN-SLEEVE', 1, 1900),\n  ('NW-10030', 'PEN-001', 1, 7900),\n  ('NW-10031', 'PEN-001', 5, 7900),\n  ('NW-10040', 'PEN-001', 1, 7900),\n  ('NW-10041', 'PEN-001', 1, 7900),\n  ('NW-90001', 'PEN-001', 1, 7900), ('NW-90001', 'PEN-TIPS-3', 1, 1200),\n  ('NW-90001', 'SHIP-EXPRESS-US', 1, 1500),\n  ('NW-90002', 'PEN-TIPS-3', 1, 1200),\n  ('NW-90003', 'PEN-001', 2, 7900),\n  ('NW-90004', 'PEN-DOCK', 1, 2900)\nON CONFLICT (order_id, sku) DO NOTHING;\n\n-- ---------------------------------------------------------------- agent runtime tables\n-- The same tables runtime/adk creates, created here by the owner so the agent's role can't alter\n-- them, drop the audit trigger or add triggers of its own. runtime/adk@1.0.6 runs no DDL when\n-- they all exist. Keep in step with the runtime's memory.py.\nCREATE TABLE IF NOT EXISTS notes (\n  id BIGSERIAL PRIMARY KEY, customer TEXT NOT NULL, note TEXT NOT NULL,\n  created TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS notes_customer ON notes (customer, created);\nCREATE TABLE IF NOT EXISTS tickets (\n  id TEXT PRIMARY KEY, customer TEXT NOT NULL,\
    \ session TEXT NOT NULL, priority TEXT NOT NULL,\n  summary TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'open',\n  created TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE TABLE IF NOT EXISTS turns (\n  id TEXT PRIMARY KEY, session TEXT NOT NULL, customer TEXT NOT NULL, message TEXT NOT NULL,\n  reply TEXT NOT NULL, trace_id TEXT, span_id TEXT, latency_ms INTEGER NOT NULL,\n  model_calls INTEGER NOT NULL, tools JSONB NOT NULL, sources JSONB NOT NULL,\n  evidence JSONB NOT NULL, retrieval TEXT NOT NULL, prompt_tokens INTEGER NOT NULL,\n  output_tokens INTEGER NOT NULL, error TEXT, created TIMESTAMPTZ NOT NULL DEFAULT now());\nCREATE INDEX IF NOT EXISTS turns_created ON turns (created);\nCREATE TABLE IF NOT EXISTS audit_events (\n  id BIGSERIAL PRIMARY KEY, at TIMESTAMPTZ NOT NULL DEFAULT clock_timestamp(), turn_id TEXT,\n  session TEXT, customer TEXT, actor TEXT NOT NULL, action TEXT NOT NULL,\n  detail JSONB NOT NULL DEFAULT '{}');\nCREATE INDEX IF NOT EXISTS audit_events_at ON audit_events (at);\nCREATE OR REPLACE FUNCTION audit_events_append_only() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN RAISE EXCEPTION 'audit_events is append-only'; END $$;\nCREATE OR REPLACE TRIGGER audit_events_no_update BEFORE UPDATE OR DELETE ON audit_events\n  FOR EACH ROW EXECUTE FUNCTION audit_events_append_only();\nCREATE OR REPLACE TRIGGER audit_events_no_truncate BEFORE TRUNCATE ON audit_events\n  FOR EACH STATEMENT EXECUTE FUNCTION audit_events_append_only();\n-- Which database login inserted each audit row (postgres-pgvector@1.2.0 era). `session_user`\n-- is the login role, which a member role can't change with SET ROLE. The trigger overrides any\n-- value the inserter sends. Nullable with no default: rows from before this change stay NULL.\n-- Attribution of the login, not tamper-evidence: this table's owner can drop the trigger.\nALTER TABLE public.audit_events ADD COLUMN IF NOT EXISTS db_role TEXT;\nCREATE OR REPLACE FUNCTION public.audit_events_db_role() RETURNS trigger LANGUAGE plpgsql\n  SET search_path = pg_catalog AS $$\nBEGIN NEW.db_role := session_user; RETURN NEW; END $$;\nCREATE OR REPLACE TRIGGER audit_events_set_db_role BEFORE INSERT ON public.audit_events\n  FOR EACH ROW EXECUTE FUNCTION public.audit_events_db_role();\n-- ADK's session tables live here; the agent's role owns this schema (and its own `support_agent`\n-- schema, where the knowledge index goes) and nothing else.\nCREATE SCHEMA IF NOT EXISTS adk_sessions AUTHORIZATION support_agent;\n\n-- ---------------------------------------------------------------- least-privilege grants\n-- The agent (DATABASE_URL): reads orders and the catalog, files cancellation REQUESTS (status\n-- stays at its 'pending' default: it has no right to that column or to UPDATE), keeps notes,\n-- tickets, turns and audit events. It can't approve a request or change an order (#750).\nGRANT SELECT ON products, orders, order_items, cancellation_requests TO support_agent;\nGRANT INSERT (id, order_id, customer_id, reason, session, turn_id)\n  ON cancellation_requests TO support_agent;\nGRANT SELECT, INSERT ON notes TO support_agent;\nGRANT INSERT ON tickets, turns, audit_events TO support_agent;\n-- A kit runtime (runtime/langgraph, #1083 F3) replays a conversation's history from `turns`\n-- (multi-framework spec \xA77.5): these columns only. ADK keeps its own sessions in adk_sessions,\n-- which this role owns, so the agent could already read every customer's conversation.\nGRANT SELECT (session, customer, message, reply, error, created) ON turns TO support_agent;\nGRANT USAGE ON SEQUENCE notes_id_seq, audit_events_id_seq TO support_agent;\n\n-- Staff (the ops dashboard): reads everything it shows, decides requests, resets the eval\n-- customers' orders for offline evals, and records its decisions in the audit trail. Its own\n-- eval tables go in its `support_ops` schema.\nGRANT SELECT ON customers, products, orders, order_items, cancellation_requests, turns,\n  audit_events TO support_ops;\nGRANT UPDATE (status) ON orders TO support_ops;\nGRANT UPDATE (status, decided_at, decided_by, decision_note),\
    \ DELETE\n  ON cancellation_requests TO support_ops;\nGRANT INSERT ON audit_events TO support_ops;\nGRANT USAGE ON SEQUENCE audit_events_id_seq TO support_ops;\n\n-- AgentBreeder's console role (`console_database` in stack.yaml), for AgentBreeder's own CLI\n-- commands (#828): read turns and audit events, keep notes, delete a customer's turns and\n-- tickets, and add audit rows (marked by db_role). Only tables this owner made are granted;\n-- the agent's own session and knowledge tables are read with the agent's credential. Guarded,\n-- because a GRANT to a missing role would fail this whole file when `console_database` is unset.\nDO $$ BEGIN\n  IF to_regrole('agentbreeder_console') IS NOT NULL THEN\n    GRANT SELECT, DELETE ON public.turns, public.tickets TO agentbreeder_console;\n    GRANT SELECT, INSERT, UPDATE, DELETE ON public.notes TO agentbreeder_console;\n    GRANT SELECT ON public.audit_events TO agentbreeder_console;\n    GRANT INSERT (turn_id, session, customer, actor, action, detail)\n      ON public.audit_events TO agentbreeder_console;\n    GRANT USAGE ON SEQUENCE public.notes_id_seq, public.audit_events_id_seq\n      TO agentbreeder_console;\n  END IF;\nEND $$;\n"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/part-of: agentbreeder-services
    app.kubernetes.io/managed-by: agentbreeder
    io.agentbreeder/stack: northwind
    io.agentbreeder/service: postgres
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      io.agentbreeder/chart-service: postgres
  serviceName: postgres-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agentbreeder-services
        app.kubernetes.io/managed-by: agentbreeder
        io.agentbreeder/stack: northwind
        io.agentbreeder/service: postgres
        io.agentbreeder/chart-service: postgres
      annotations:
        io.agentbreeder/config-sha256: '98cf39564aaa7c94de102765258896994ad80e2802ea45f7dab40c61aee4bcc3'
    spec:
      serviceAccountName: ab-svc-postgres
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: pgvector/pgvector@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
        - name: AGENTBREEDER_SERVICE
          value: postgres
        - name: CONSOLE_DATABASE
          value: support
        - name: INIT_SQL_DATABASE
          value: support
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/superuser
        - name: POSTGRES_USER
          value: postgres
        - name: ROLES_DATABASE
          value: support
        resources:
          requests:
            cpu: '100m'
            memory: '256Mi'
          limits:
            cpu: '2'
            memory: '2Gi'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: scratch-0
          mountPath: /var/run/postgresql
        - name: files
          mountPath: /files
          readOnly: true
        - name: params
          mountPath: /run/params
          readOnly: true
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        - name: data-data
